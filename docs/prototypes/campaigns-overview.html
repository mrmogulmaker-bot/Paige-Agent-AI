<title>Campaign Command Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════════════════════════
   FLOW PROTOTYPE — Campaigns › Overview becomes the Campaign Command Desk (Solo tier)
   Throwaway · read-only · zero production mutation · every write is a local mock.

   WHAT THIS IS. The cross-functional operating view for growth initiatives. It does NOT recreate
   Catalog, Sales, Pipeline, Social, Performance, Vibe Studio, CRM, or the global Command Center —
   it coordinates a campaign across them and routes into the source-owning subtab to do the work.

   THE ONE TRUTH THAT SHAPES EVERYTHING. useSoloCampaigns() returns campaigns:[] ALWAYS, by design
   (src/solo/useSoloCampaigns.ts L184-187): "the tenant-campaigns bridge is not tenant-authorized
   upstream, so Solo deliberately does not call it. Keep Overview unavailable until a server-derived,
   tenant-scoped all-state contract exists." So there is NO campaign-object store today. A campaign
   here is an OWNER-SUPPLIED BRIEF (a planned item), never a fabricated running campaign. Its loop
   stages draw on the real per-domain sources that DO exist, or show an honest absence.

   PALETTE PROVENANCE — nothing visual here is authored:
     .paige-solo tokens .......... src/solo/solo-tokens.css L2-L25 (Mineral / Obsidian), verbatim,
                                   mirrored via docs/prototypes/offer-catalog.html L43-L72
     --pg-canvas ................. src/index.css (dark/light), verbatim
     .campaigns-* geometry ....... src/solo/solo-campaigns.css, verbatim / adapted
     truth vocabulary ............ src/solo/growth2.tsx L23-L31 (LIVE/PARTIAL/PROPOSED/UNAVAILABLE)
     six-view IA + ownership ..... docs/design-references/cd-packs/super-admin-shell-v3/
                                   campaigns-catalog-sales-spec.md §1 (Active/Catalog/Sales/Pipeline/
                                   Social/Performance) + §5 (bottom rail, control chrome)
     real data contract .......... src/solo/useSoloCampaigns.ts (artifacts, submissions,
                                   pipelineWorkspace, offers via CatalogOffers, recorded payments)

   DATA-SOURCE LEGEND used in every annotation region:
     LIVE READ     a real tenant-scoped read exists today (Pipeline deals, published Vibe artifacts,
                   routed form submissions, recorded payments, recorded social handles).
     OWNER BRIEF   the owner authored/declared it. No system fact is claimed.
     UNAVAILABLE   the platform cannot know it and does not guess (campaign rollup, attribution,
                   provider figures). Shown as UNAVAILABLE / not checked / needs confirmation.
     MOCK          representative prototype data, labeled, for a state that has no live example yet.

   The review harness uses its own --rv-* slate, deliberately OUTSIDE the product palette, so
   developer chrome can never be mistaken for product surface. Same rule the house prototypes
   (offer-catalog.html, solo-automations-recovery.html) established.
   ═══════════════════════════════════════════════════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box}

/* ── REVIEW HARNESS SLATE — not product ──────────────────────────────────────────────────── */
:root{
  --rv-bg:#eceef1;--rv-panel:#f7f8fa;--rv-edge:#ccd2da;--rv-edge-2:#aab4c0;
  --rv-ink:#1b2027;--rv-ink-2:#48525f;--rv-faint:#6d7885;
  --rv-live:#1f6f4a;--rv-mock:#8a5a12;--rv-dead:#9a3b30;--rv-focus:#2f6fd0;--rv-new:#5a3f9e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-rv="light"]){
  --rv-bg:#14171c;--rv-panel:#1b1f26;--rv-edge:#2e353f;--rv-edge-2:#434c58;
  --rv-ink:#eef1f5;--rv-ink-2:#b3bcc7;--rv-faint:#8b95a2;
  --rv-live:#6fc79b;--rv-mock:#e0b268;--rv-dead:#e59287;--rv-focus:#7aa9ee;--rv-new:#b09ae8;
  color-scheme:dark;
}}
html,body{height:100%}
body{margin:0;background:var(--rv-bg);color:var(--rv-ink);
  font:400 13px/1.55 "Geist","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* ── PRODUCT TOKENS — verbatim from src/solo/solo-tokens.css (Mineral) ────────────────────── */
.paige-solo{
  --font:'Geist','Söhne',-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --canvas:#F6F5F1;--surface:#FFFFFF;--surface-2:#FBFAF7;--surface-sunk:#F0EEE8;
  --line:#E5E1D8;--line-soft:#EFECE4;
  --ink:#171331;--ink-2:#4A4566;--ink-3:#7E7995;--ink-inv:#FBFAF7;
  --rail:#171331;--rail-2:#221C46;--rail-line:#332C5E;--rail-text:#C9C4E0;
  --gold:#C9860C;--gold-bright:#E9A83A;--gold-tint:#FBF1DE;--gold-line:#EFDCB4;
  --violet:#5B3FD6;--violet-2:#7A62E8;--violet-tint:#EEEAFD;--violet-line:#DAD1FA;
  --ok:#1B7A52;--ok-tint:#E4F2EB;--warn:#B4700A;--warn-tint:#FBF0DD;--bad:#B93E37;--bad-tint:#FAE9E7;
  --r-s:8px;--r-m:12px;--r-l:18px;--r-xl:26px;
  --sh-1:0 1px 2px rgba(23,19,49,.05);
  --sh-2:0 2px 4px rgba(23,19,49,.04),0 12px 28px -12px rgba(23,19,49,.14);
  --sh-3:0 24px 60px -18px rgba(23,19,49,.28);
  --pg-canvas:#fbf9f5;
  color-scheme:light;
}
/* Obsidian — verbatim from src/solo/solo-tokens.css dark block */
.paige-solo[data-theme="dark"]{
  --canvas:#0C0A1B;--surface:#141129;--surface-2:#191637;--surface-sunk:#100D24;
  --line:#282348;--line-soft:#221D3E;
  --ink:#EFECFA;--ink-2:#B0AACB;--ink-3:#7D779A;--ink-inv:#141129;
  --rail:#100D24;--rail-2:#1B1738;--rail-line:#282348;--rail-text:#B0AACB;
  --gold:#E9A83A;--gold-bright:#F5C266;--gold-tint:#2C2211;--gold-line:#4A3A17;
  --violet:#8A72F5;--violet-2:#A692FF;--violet-tint:#221C4A;--violet-line:#352C68;
  --ok:#4CC48C;--ok-tint:#12301F;--warn:#E3A63C;--warn-tint:#2E2311;--bad:#EE7A72;--bad-tint:#331817;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 2px 4px rgba(0,0,0,.25),0 12px 28px -12px rgba(0,0,0,.5);
  --sh-3:0 24px 60px -18px rgba(0,0,0,.6);
  --pg-canvas:#100e14;
  color-scheme:dark;
}

/* ── SHELL PRIMITIVES — src/solo/solo-tokens.css ─────────────────────────────────────────── */
.paige-solo{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;height:100%;position:relative;overflow:hidden}
.paige-solo h1,.paige-solo h2,.paige-solo h3,.paige-solo h4{margin:0;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.paige-solo p{margin:0}
.paige-solo button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
.paige-solo input,.paige-solo select,.paige-solo textarea{font-family:inherit;font-size:inherit;color:inherit}
.paige-solo .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.paige-solo .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.paige-solo .btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;
  font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);transition:.15s;white-space:nowrap;flex:none}
.paige-solo .btn:hover{background:var(--surface-sunk)}
.paige-solo .btn:disabled{opacity:.5;cursor:not-allowed}
.paige-solo .btn-p{background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}
.paige-solo[data-theme="dark"] .btn-p{background:var(--violet);border-color:var(--violet);color:#fff}
.paige-solo .btn-g{background:var(--gold);color:#231a06;border-color:var(--gold)}
.paige-solo .btn-g:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
.paige-solo[data-theme="dark"] .btn-g{color:#241a06}
.paige-solo .btn-s{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.paige-solo .btn-icon{width:34px;padding:0;justify-content:center}
.paige-solo .row{display:flex;align-items:center;gap:12px}
.paige-solo .grow{flex:1;min-width:0}
.paige-solo .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paige-solo ::-webkit-scrollbar{width:10px;height:10px}
.paige-solo ::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}

/* ── SOLO SHELL CHROME — rail + topbar, matching the shipped surface ─────────────────────── */
.sh{display:grid;grid-template-columns:var(--rail-w,216px) minmax(0,1fr) var(--paige-w,0px);height:100%;min-height:0;background:var(--canvas)}
.sh-rail{background:var(--rail);border-right:1px solid var(--rail-line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sh-brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px}
.sh-brand .mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));display:grid;place-items:center;color:#231a06;font:700 13px/1 var(--font);flex:none}
.sh-brand b{color:#fff;font:600 12.5px/1 var(--font);letter-spacing:.18em}
.sh-brand small{display:block;color:var(--rail-text);font-size:9.5px;letter-spacing:.12em;margin-top:4px}
.sh-nav{display:grid;gap:2px;padding:8px 12px;flex:1;min-height:0;align-content:start;overflow:auto}
.sh-nav button{display:flex;align-items:center;gap:12px;height:40px;padding:0 13px;border-radius:11px;
  color:var(--rail-text);font-size:13px;text-align:left;width:100%}
.sh-nav button svg{flex:none;opacity:.85}
.sh-nav button:hover{background:var(--rail-2)}
.sh-nav button[aria-current="page"]{background:var(--rail-2);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px var(--rail-line)}
.sh-nav button[aria-current="page"] svg{opacity:1;color:var(--gold-bright)}
.sh-foot{padding:8px 12px 12px;border-top:1px solid var(--rail-line);display:grid;gap:6px}
.sh-who{display:flex;align-items:center;gap:10px;color:var(--rail-text)}
.sh-who i{width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;
  font:600 11px/1 var(--font);font-style:normal;flex:none}
.sh-who b{color:#fff;font-size:12px;font-weight:600;display:block}
.sh-who small{color:var(--rail-text);font-size:10px}
.sh-main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--canvas)}
.sh-top{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.sh-top .crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.sh-top .crumbs b{color:var(--ink);font-weight:600}
.sh-top .themeswatch{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-size:11.5px}
.sh-topact{display:flex;align-items:center;gap:8px;margin-left:auto}
.sh-topbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3)}
.sh-topbtn:hover{color:var(--gold);border-color:var(--gold-line)}

/* PAIGE dock column (only rendered when expanded/docked demo is on) */
.sh-paige{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sh-paige header{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px}
.sh-paige header .mk{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--violet-2),var(--violet));display:grid;place-items:center;color:#fff;font:700 12px/1 var(--font)}
.sh-paige .pbody{flex:1;overflow:auto;padding:14px 16px;display:grid;gap:10px;align-content:start}
.sh-paige .pmsg{font-size:12.5px;line-height:1.55;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 13px}
.sh-paige .pmsg b{color:var(--ink)}
.sh-paige .pfoot{border-top:1px solid var(--line-soft);padding:12px 14px}
.sh-paige .pfoot .fld{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);padding:8px 10px;color:var(--ink-3);font-size:12.5px}

/* ── CAMPAIGNS NAV — src/solo/solo-campaigns.css (verbatim geometry) ─────────────────────── */
.solo-campaigns{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--pg-canvas);color:var(--ink)}
.campaigns-nav{min-height:48px;display:flex;align-items:stretch;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--pg-canvas);flex:none;min-width:0}
.campaigns-tabs{display:flex;align-items:stretch;gap:20px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;flex:1 1 auto;min-width:0}
.campaigns-tabs button{display:flex;align-items:center;gap:7px;flex:none;padding:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink-3);font-size:13px;font-weight:500;white-space:nowrap}
.campaigns-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:650}
.campaigns-tabs button[aria-selected="true"] svg{color:var(--gold)}
.campaigns-tabs button:focus-visible{outline:2px solid var(--violet);outline-offset:-2px;border-radius:4px}
.campaigns-truth-key{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:340px;align-self:center}
.campaigns-studio{align-self:center;flex:none}
.campaigns-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px 22px 30px;scrollbar-gutter:stable}

/* truth tags — colours from solo-campaigns.css */
.campaigns-truth{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid var(--line);border-radius:999px;font:650 9px/1 var(--mono);letter-spacing:.09em;background:var(--surface-sunk);color:var(--ink-3);text-transform:uppercase}
.campaigns-truth--live{color:var(--ok)}
.campaigns-truth--partial{color:var(--violet)}
.campaigns-truth--proposed{color:var(--warn)}
.campaigns-truth--unavailable{color:var(--ink-3)}
.campaigns-truth--owner{color:var(--gold)}
.campaigns-truth--mock{color:var(--warn);border-style:dashed}

/* ── COMMAND DESK ─────────────────────────────────────────────────────────────────────────── */
.desk{max-width:1280px;margin:0 auto;display:grid;gap:14px}

/* command header (compact — §11 banner rule, no hero) */
.cmd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);overflow:hidden}
.cmd-brief{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding:16px 18px 14px;border-bottom:1px solid var(--line-soft);background:linear-gradient(118deg,var(--surface),var(--surface-2))}
.cmd-brief .eyebrow{display:flex;align-items:center;gap:8px}
.cmd-line{margin-top:8px;font-size:14.5px;line-height:1.5;color:var(--ink);letter-spacing:-.01em;max-width:720px}
.cmd-line b{font-weight:650}
.cmd-line .moving{color:var(--ok);font-weight:650}
.cmd-line .blocked{color:var(--bad);font-weight:650}
.cmd-line .move{color:var(--ink);font-weight:700}
.cmd-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:11px;font-size:11px;color:var(--ink-3)}
.cmd-meta span{display:inline-flex;align-items:center;gap:5px}
.cmd-meta .dot{width:6px;height:6px;border-radius:50%;flex:none}
.cmd-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:184px}
.cmd-actions .btn{justify-content:center}
.cmd-actions .hint{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.4}
.cmd-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 18px;background:var(--surface)}
.cmd-search{flex:1;min-width:190px;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-3)}
.cmd-search input{flex:1;border:0;background:none;outline:none;font-size:13px;color:var(--ink)}
.cmd-search input::placeholder{color:var(--ink-3)}
.filterchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-size:12px}
.filterchip select{border:0;background:none;outline:none;color:var(--ink);font-weight:500;font-size:12px}
.filterchip.is-off{opacity:.55}
.filterchip.is-off .lockmini{color:var(--ink-3)}

/* growth-loop command map */
.loop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);overflow:hidden}
.loop-head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
.loop-head h3{font-size:13.5px}
.loop-head .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.loop-head .scope{margin-left:auto;font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.loop-head .scope b{color:var(--ink);font-weight:600}
.loop-track{display:flex;align-items:stretch;gap:0;padding:16px 14px 18px;overflow-x:auto;scrollbar-width:thin}
.loop-seg{flex:1 1 0;min-width:118px;position:relative;display:flex;flex-direction:column}
.loop-node{margin:0 5px;padding:11px 11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);
  display:grid;gap:7px;cursor:pointer;transition:.16s;height:100%;text-align:left;width:calc(100% - 10px)}
.loop-node:hover{border-color:var(--line-strong,var(--violet-line));transform:translateY(-2px);box-shadow:var(--sh-2)}
.loop-node:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.loop-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.loop-name{font-size:12px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.loop-state{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600}
.loop-state .sd{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);flex:none}
.loop-src{font-size:9.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.02em}
.loop-need{font-size:10.5px;color:var(--ink-2);line-height:1.35;border-top:1px dashed var(--line-soft);padding-top:6px}
.loop-arrow{align-self:center;color:var(--ink-3);flex:none;margin:0 -2px;opacity:.6}
.loop-seg:last-child .loop-arrow{display:none}

/* portfolio */
.pf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);overflow:hidden}
.pf-head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
.pf-head h3{font-size:13.5px}
.pf-head .count{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.pf-row{border-bottom:1px solid var(--line-soft)}
.pf-row:last-child{border-bottom:0}
.pf-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 18px;cursor:pointer;transition:background .14s}
.pf-main:hover{background:var(--surface-2)}
.pf-phase{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.pf-id{min-width:0}
.pf-id .nm{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pf-id .obj{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.pf-facts{display:flex;flex-wrap:wrap;gap:5px 8px;margin-top:8px}
.pf-fact{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);background:var(--surface-sunk);border:1px solid var(--line-soft);border-radius:7px;padding:2px 7px}
.pf-fact .fk{color:var(--ink-3)}
.pf-fact.warn{color:var(--warn);background:var(--warn-tint);border-color:var(--warn)}
.pf-fact.dim{color:var(--ink-3)}
.pf-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;text-align:right}
.pf-next{font-size:11px;color:var(--ink-2);max-width:190px}
.pf-next b{color:var(--ink);font-weight:600}
.pf-caret{color:var(--ink-3);transition:transform .18s}
.pf-row.open .pf-caret{transform:rotate(90deg)}
.phasepill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:10.5px;font-weight:600;border:1px solid var(--line)}
.phasepill .sd{width:6px;height:6px;border-radius:2px;transform:rotate(45deg)}

/* expand: readiness fold-out */
.pf-fold{padding:2px 18px 18px;display:grid;gap:14px}
.rd{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);overflow:hidden}
.rd-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.rd-head h4{font-size:12px}
.rd-head .note{font-size:10.5px;color:var(--ink-3);margin-left:auto;max-width:340px;text-align:right;line-height:1.35}

function filtered(list){
  return list.filter(c=>{
    if(S.filters.phase!=='all' && c.phase!==S.filters.phase) return false;
    if(S.filters.q && !(c.name+' '+c.objective).toLowerCase().includes(S.filters.q.toLowerCase())) return false;
    if(S.filters.src!=='all'){
      // "Source state" is derivable and honest: a brief is live-backed if any loop stage reads from a
      // real source (ready/partial); otherwise it is all planned/setup/unavailable.
      const hasLive=Object.values(c.loop).some(v=>v==='ready'||v==='partial');
      if(S.filters.src==='live' && !hasLive) return false;
      if(S.filters.src==='unavail' && hasLive) return false;
    }
    return true;
  });
}

/* command line — plain English, derived from the briefs, honest ----------------------------- */
function commandLine(list){
  if(!list.length) return `Nothing is in motion yet. <b class="move">Start a campaign brief</b> to give this workspace its first initiative.`;
  const moving=list.filter(c=>['building','active','awaiting'].includes(c.phase)).length;
  const blocked=list.filter(c=>c.phase==='blocked'||c.blocker).length;
  const awaiting=list.filter(c=>c.phase==='awaiting').length;
  let parts=[];
  parts.push(`<span class="moving">${moving} moving</span>`);
  if(blocked) parts.push(`<span class="blocked">${blocked} blocked</span>`);
  const nextC=list.find(c=>c.phase==='awaiting')||list.find(c=>c.phase==='blocked')||list.find(c=>c.blocker)||list.find(c=>c.phase==='building')||list[0];
  let move;
  if(awaiting) move=`Highest-value move: <b class="move">approve the action waiting on ${nextC.name}</b>.`;
  else if(blocked) move=`Highest-value move: <b class="move">clear the blocker on ${nextC.name}</b> — ${nextC.blocker}.`;
  else move=`Highest-value move: <b class="move">${nextC.next}</b>`;
  return `${parts.join(' · ')} across ${list.length} initiative${list.length>1?'s':''}. ${move}`;
}

/* ── loop map (workspace scope, or a focused campaign) --------------------------------------- */
function loopMap(list){
  const focus=S.focusCampaign? list.find(c=>c.id===S.focusCampaign):null;
  const scope=focus? `Campaign · <b>${focus.name}</b>` : `Workspace scope`;
  const cells=LOOP.map(seg=>{
    let stKey;
    if(focus){ stKey=focus.loop[seg.k]; }
    else {
      // workspace scope: derive from real source posture + provider scenario
      stKey=seg.srcState;
      if((seg.k==='distribution'||seg.k==='conversations')) stKey='unavail';
      if(seg.k==='pipeline' && S.scenario==='source-fail') stKey='blocked';
    }
    const st=STATE[stKey]||STATE.unavail;
    const failed=(seg.k==='pipeline' && S.scenario==='source-fail');
    const srcTxt=failed?'Read failed':seg.src;
    const needTxt = failed? 'The pipeline read failed. Records unchanged.' :
      (stKey==='ready'?'Source connected.':(stKey==='unavail'?seg.need:(stKey==='setup'?seg.need:seg.need)));
    return `<div class="loop-seg">
      <button class="loop-node" data-loop="${seg.k}" aria-label="${seg.name}: ${st.label}. Owned by ${seg.owner}.">
        <span class="loop-ic ${st.cls}" style="background:var(--surface-sunk)">${svg(seg.ic,16)}</span>
        <span class="loop-name">${seg.name}</span>
        ${stateChip(stKey)}
        <span class="loop-src">${srcTxt}</span>
        <span class="loop-need">${needTxt} ${routeChip(seg.owner)}</span>
      </button>
      <span class="loop-arrow">${svg(ICON.arrow,15)}</span>
    </div>`;
  }).join('');
  return `<section class="loop" aria-label="Growth-loop command map">
    <div class="loop-head">
      <span class="loop-ic st-partial" style="background:var(--surface-sunk)">${svg(ICON.route,16)}</span>
      <div><h3>Growth-loop command map</h3><div class="sub">Offer → Audience → Content → Distribution → Conversations → Pipeline → Recorded outcome</div></div>
      <div class="scope">${focus?`${svg(ICON.target,13)} ${scope} <button class="btn btn-s" data-act="clear-focus">Workspace scope</button>`:scope}</div>
    </div>
    <div class="loop-track">${cells}</div>
  </section>`;
}

/* ── work in motion (right column) ----------------------------------------------------------- */
function workInMotion(list){
  const items=[];
  const awaiting=list.find(c=>c.phase==='awaiting');
  if(awaiting) items.push(['await',ICON.clock,'Action awaiting your approval',`${awaiting.name}: “Send the launch email to the warm list.”`,'Owner brief · governed action (mock)']);
  const building=list.find(c=>c.phase==='building');
  if(building) items.push(['partial',ICON.edit,'Draft in progress',`${building.name}: landing pages in Vibe Studio, still in Draft.`,'LIVE read · growth_pages.status = draft']);
  const blocked=list.find(c=>c.blocker);
  if(blocked) items.push(['blocked',ICON.alert,'Blocked initiative',`${blocked.name}: ${blocked.blocker}`,'Owner brief · dependency unmet']);
  // a real completed outcome only if we can source it — here, recorded payments (no attribution claim, no invented count)
  if(S.ws==='meridian') items.push(['ready',ICON.check,'Recorded payments',`Payments read from Sales (bounded to the latest 50 records). No campaign attribution is claimed.`,'LIVE read · recorded payments']);
  if(!items.length) items.push(['planned',ICON.dot,'Nothing queued yet','Real, attributable work appears here — a prepared brief, a pending approval, a queued item, a blocker, a completed outcome.','No attributable work on record']);
  const rows=items.map(([st,ic,t,s,src])=>`<div class="wm">
    <span class="wm-ic ${STATE[st].cls}" style="background:var(--surface-sunk)">${svg(ic,15)}</span>
    <div><div class="wm-t">${t}</div><div class="wm-s">${s}</div><div class="wm-src">${src}</div></div>
    ${st==='await'?`<button class="btn btn-s" data-dossier="${awaiting.id}">Review</button>`:''}
  </div>`).join('');
  return `<section class="pf" aria-label="Work in motion">
    <div class="pf-head">${svg(ICON.pulse,16)}<h3>Work in motion</h3></div>
    <div style="padding:12px 14px 14px"><div class="wm-list">${rows}</div>
    <button class="btn btn-s" data-ask="workspace" style="margin-top:12px;width:100%;justify-content:center">${svg(ICON.spark,13)} Ask PAIGE to coordinate this campaign</button>
    <p style="font-size:10.5px;color:var(--ink-3);line-height:1.5;margin-top:9px">PAIGE can recommend, prepare, and route. She does not launch campaigns, spend, publish, or send without a governed approval.</p>
    </div>
  </section>`;
}

function overviewBody(){

const BB_STAGES=['Name & objective','Offer','Audience','Outcome','Channels','Timing & budget','Content needs','Conversion & follow-up','Success evidence'];
function briefBuilder(){
  const st=S.briefStage;
  const b=S.brief||{};
  const chips=BB_STAGES.map((s,i)=>`<button class="bb-chip" data-bstage="${i}" data-done="${i<st}" aria-current="${i===st}">${i<st?svg(ICON.check,11):''}${s}</button>`).join('');
  let body='';
  if(st===0) body=`
    <div class="bb-field"><label>Campaign name <span class="req">Required</span></label><input id="bf-name" value="${esc(b.name)}" placeholder="e.g. Spring Masterclass launch"></div>
    <div class="bb-field"><label>Objective <span class="req">Required</span></label><textarea id="bf-obj" placeholder="The measurable outcome — fill a cohort, book 10 calls, renew the retainers…">${esc(b.obj)}</textarea><span class="help">Plain English. This becomes the “what is this for” the whole loop points at.</span></div>`;
  else if(st===1) body=`
    <div class="bb-field"><label>Linked offer <span class="opt">Optional now</span></label>
      <select id="bf-offer"><option value="">Choose a real offer from Catalog…</option><option ${b.offer==='Advisory Systems Masterclass'?'selected':''}>Advisory Systems Masterclass</option><option ${b.offer==='Fractional Advisory Retainer'?'selected':''}>Fractional Advisory Retainer</option><option ${b.offer==='Free Strategy Call'?'selected':''}>Free Strategy Call</option></select>
      <span class="help">Offers come from <b>Catalog</b> — this list is your real product records.</span></div>
    <div class="bb-link">${svg(ICON.plus,13)} No offer yet? Create one in Catalog. <button class="rroute" data-route="Catalog">Open Catalog ${svg(ICON.arrow,11)}</button></div>`;
  else if(st===2) body=`
    <div class="bb-field"><label>Target audience</label><input id="bf-aud" value="${esc(b.aud)}" placeholder="A saved segment, or describe who this reaches"><span class="help">Segments come from <b>Relationships</b>. Describe it and Paige can draft the rule — sizing stays honest (unsized if a clause isn’t live).</span></div>
    <div class="bb-field"><label>Positioning</label><textarea placeholder="The angle — why this audience, why now.">${esc(b.pos)}</textarea></div>`;
  else if(st===3) body=`
    <div class="bb-field"><label>Desired business outcome</label><textarea placeholder="What changes for the business if this works.">${esc(b.outcome)}</textarea></div>`;
  else if(st===4) body=`
    <div class="bb-field"><label>Channels / tactics</label>
      <div class="chips-pick">
        <button aria-pressed="${(b.ch||[]).includes('Landing page')}" data-ch="Landing page">Landing page</button>
        <button aria-pressed="${(b.ch||[]).includes('Email')}" data-ch="Email">Email</button>
        <button aria-pressed="${(b.ch||[]).includes('Form')}" data-ch="Form">Form</button>
        <button aria-pressed="false" disabled title="No connected social provider">${svg(ICON.lock,11)} Social publishing</button>
        <button aria-pressed="false" disabled title="No connected messaging provider">${svg(ICON.lock,11)} SMS</button>
      </div>
      <span class="help warn">Social publishing and SMS are disabled until a provider is connected in Social — the brief never pretends a channel is ready.</span></div>`;
  else if(st===5) body=`
    <div class="bb-field"><label>Timing</label><input type="text" placeholder="e.g. Launch April 8, close April 22" value="${esc(b.timing)}"></div>
    <div class="bb-field"><label>Budget target <span class="opt">Optional</span></label><input id="bf-budget" placeholder="e.g. $500" value="${esc(b.budget)}">
      <span class="help warn">This is a target you’re setting — <b>not</b> actual ad spend, a forecast, or connected media buying. Real spend needs a connected ad provider, which doesn’t exist yet.</span></div>`;
  else if(st===6) body=`
    <div class="bb-field"><label>Content / source-material needs</label><textarea placeholder="What creative this needs — a page, a funnel, a form, an email sequence.">${esc(b.content)}</textarea>
      <span class="help">Creative is made in <b>Vibe Studio</b>. This just records what’s needed.</span></div>

    <header>
      <div><div class="eyebrow">${b.id?'Edit brief':'New campaign brief'}</div><h2 id="bb-title">${esc(b.name)||'Untitled campaign'}</h2><div class="sub">Step ${st+1} of ${BB_STAGES.length} · ${BB_STAGES[st]}</div></div>
      <button class="btn btn-icon" data-close="1" aria-label="Cancel and close" id="dw-x">${svg(ICON.x,15)}</button>
    </header>
    <div class="dw-body">
      <div class="bb-stages">${chips}</div>
      ${body}
    </div>
    <div class="dw-foot">
      <button class="btn" data-act="bb-prev" ${st===0?'disabled':''}>Back</button>
      ${st<BB_STAGES.length-1?`<button class="btn btn-p" data-act="bb-next">Continue</button>`:''}
      <span style="margin-left:auto"></span>
      ${saveEcho||`<button class="btn" data-act="bb-save-draft">${svg(ICON.doc,13)} Save draft</button>${st===BB_STAGES.length-1?`<button class="btn btn-g" data-act="bb-review">${svg(ICON.check,14)} Request review</button>`:''}`}
    </div>
  </aside>`;
}

/* ── mount ──────────────────────────────────────────────────────────────────────────────────── */
let lastFocus=null;
function render(){
  const app=el('app');
  app.setAttribute('data-theme', S.theme==='dark'?'dark':'');
  app.setAttribute('data-rm', S.rm?'1':'0');
  app.style.setProperty('--rail-w', (S.vp.startsWith('900')||S.vp.startsWith('1024'))?'72px':'232px');
  // rail compaction below ~1080 — mirror the shipped behavior note
  let html=shell();
  if(S.drawer==='dossier' && S.drawerCampaign){ const c=briefs().find(x=>x.id===S.drawerCampaign); if(c) html+=dossierDrawer(c); }
  if(S.drawer==='brief'){ html+=briefBuilder(); }
  if(S.toast) html+=`<div class="toast ${S.toast.k}" role="status"><span class="ti">${svg(S.toast.k==='ok'?ICON.check:S.toast.k==='err'?ICON.alert:ICON.spark,15)}</span>${S.toast.msg}</div>`;
  app.innerHTML=html;
  wire();
  // Focus management for drawers. innerHTML replace drops the focused node every render, so recover
  // focus INTO the drawer whenever it is not already there — that both auto-focuses on open and
  // keeps focus inside the drawer after an in-drawer re-render (channel chip, stage step), so the
  // Tab trap is never defeated by focus falling to <body>.
  if(S.drawer){ const dw=el('dw'), x=el('dw-x'); if(x && dw && !dw.contains(document.activeElement)) x.focus(); }
}
/* focus trap — Tab cycles inside an open drawer only (the accessibility claim the shipped surface makes) */
function trapTab(e){
  if(e.key!=='Tab' || !S.drawer) return;
  const dw=el('dw'); if(!dw) return;
  const f=[...dw.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(n=>n.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

function toast(msg,k='ok'){ S.toast={msg,k}; render(); clearTimeout(toast._t); toast._t=setTimeout(()=>{S.toast=null;render();}, S.rm?1200:2600); }
function routeToast(owner){ toast(`Prototype: this routes into <b>${owner}</b>${OWNER_ROUTE[owner]&&OWNER_ROUTE[owner].startsWith('/')?` (<span class="mono">/solo/…${OWNER_ROUTE[owner]}</span>)`:''}. Overview coordinates; ${owner} owns the work.`, 'nav'); }
function paige(ctx){ toast(`Prototype: opens the existing PAIGE chat with campaign context preserved (${ctx}). No second chat system is created.`, 'nav'); }

function closeDrawer(){ S.drawer=null; S.drawerCampaign=null; S.brief=null; S.briefStage=0; S.save='idle'; S._forceSaveFail=false; render(); if(lastFocus&&lastFocus.isConnected){lastFocus.focus();} lastFocus=null; }

function wire(){
  // loop node routing
  document.querySelectorAll('[data-loop]').forEach(b=>b.onclick=()=>{const seg=LOOP.find(s=>s.k===b.dataset.loop); routeToast(seg.owner);});
  document.querySelectorAll('[data-route]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); routeToast(b.dataset.route);});
  // portfolio expand
  document.querySelectorAll('[data-rowmain]').forEach(m=>{
    const id=m.dataset.rowmain;
    m.onclick=(e)=>{ if(e.target.closest('[data-dossier]')||e.target.closest('[data-route]'))return; S.openRow=S.openRow===id?null:id; render(); };
    m.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); S.openRow=S.openRow===id?null:id; render(); } };
  });
  document.querySelectorAll('[data-dossier]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); lastFocus=document.activeElement; S.drawer='dossier'; S.drawerCampaign=b.dataset.dossier; S._drawerFocused=false; render();});
  document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{ S.focusCampaign=b.dataset.focus; el('scroll').scrollTop=0; render(); });
  document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); paige(b.dataset.ask==='workspace'?'whole workspace':'one campaign');});
  // acts
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); act(b.dataset.act);});
  // drawer close
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer);
  // brief builder stage chips + inputs
  document.querySelectorAll('[data-bstage]').forEach(b=>b.onclick=()=>{ captureBrief(); S.briefStage=+b.dataset.bstage; render(); });
  document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ S.brief=S.brief||{}; const ch=S.brief.ch||[]; const v=b.dataset.ch; S.brief.ch = ch.includes(v)?ch.filter(x=>x!==v):[...ch,v]; render(); });
  // tabs (mock — Overview is the built one)
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>toast(`Prototype: “${b.querySelector('span').textContent}” is a sibling subtab, unchanged and owned by its team. This prototype builds Overview only.`,'nav'));
  // search + filters
  const q=el('cmd-q'); if(q) q.oninput=()=>{ S.filters.q=q.value; const s=el('scroll').scrollTop; renderKeepScroll(s); };
  const fp=el('f-phase'); if(fp) fp.onchange=()=>{ S.filters.phase=fp.value; render(); };
  const fs=el('f-src'); if(fs) fs.onchange=()=>{ S.filters.src=fs.value; render(); };
}
function renderKeepScroll(top){ render(); const sc=el('scroll'); if(sc) sc.scrollTop=top; const q=el('cmd-q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} }

function captureBrief(){
  S.brief=S.brief||{};
  const g=(id)=>{const e=el(id); return e?e.value:undefined;};
  if(g('bf-name')!==undefined) S.brief.name=g('bf-name');
  if(g('bf-obj')!==undefined) S.brief.obj=g('bf-obj');
  if(g('bf-offer')!==undefined) S.brief.offer=g('bf-offer');
  if(g('bf-aud')!==undefined) S.brief.aud=g('bf-aud');
  if(g('bf-budget')!==undefined) S.brief.budget=g('bf-budget');
}

function act(a){
  if(a==='new-brief'){ lastFocus=document.activeElement; S.drawer='brief'; S.brief={}; S.briefStage=0; S.save='idle'; S._forceSaveFail=false; render(); return; }
  if(a==='ask-plan'){ paige('plan a new campaign'); return; }
  if(a==='refresh'||a==='retry'){ toast('Prototype: re-issues the tenant-scoped source reads. Records are never changed by a refresh.','nav'); return; }
  if(a==='clear-filters'){ S.filters={phase:'all',src:'all',q:''}; render(); return; }
  if(a==='clear-focus'){ S.focusCampaign=null; render(); return; }
  if(a==='edit-brief'){ const c=briefs().find(x=>x.id===S.drawerCampaign); S.drawer='brief'; S.brief={id:c.id,name:c.name,obj:c.objective,offer:c.offer||'',aud:c.audience||''}; S.briefStage=0; S._drawerFocused=false; render(); return; }
  if(a==='approve-action'){ closeDrawerToToast('ok','Prototype: routes through the existing governed approval path. Paige only acts after your yes — she never sends on her own.'); return; }
  if(a==='send-back'){ closeDrawerToToast('nav','Prototype: returns the prepared action to Paige with your notes. Nothing was sent.'); return; }
  if(a==='bb-next'){ captureBrief(); S.briefStage=Math.min(BB_STAGES.length-1,S.briefStage+1); render(); return; }
  if(a==='bb-prev'){ captureBrief(); S.briefStage=Math.max(0,S.briefStage-1); render(); return; }
  if(a==='bb-save-draft'||a==='bb-review'){ captureBrief();
    if(!(S.brief&&S.brief.name&&S.brief.name.trim())){ S.briefStage=0; S.save='idle'; render(); toast('A brief needs a name before it can be saved.','err'); return; }
    // demonstrate the honest save lifecycle: saving → (saved | error). Toggle error via scenario or random.
    S.save='saving'; render();
    const willFail = S._forceSaveFail===true;
    setTimeout(()=>{ S.save=willFail?'error':'saved'; render(); if(!willFail){ setTimeout(()=>{ closeDrawer(); toast(a==='bb-review'?'Draft saved and sent for review (mock).':'Draft saved to this workspace (mock).','ok'); },700);} }, S.rm?200:850);
    return; }
  if(a==='save-retry'){ S._forceSaveFail=false; act('bb-save-draft'); return; }
}
function closeDrawerToToast(k,msg){ closeDrawer(); toast(msg,k); }

/* ── apply a scenario ──────────────────────────────────────────────────────────────────────── */
function applyScenario(sc){
  S.scenario=sc; S.openRow=null; S.focusCampaign=null; S.drawer=null; S.drawerCampaign=null; S.brief=null; S.briefStage=0; S.save='idle'; S.readonly=false; S.surface='ready'; S._forceSaveFail=false; S._drawerFocused=false;
  if(sc==='first-run'){ S.ws='northpeak'; S.surface='first-run'; }
  else if(sc==='unavailable'){ S.surface='unavailable'; }
  else if(sc==='loading'){ S.surface='loading'; }
  else if(sc==='readonly'){ S.ws='meridian'; S.readonly=true; }
  else if(sc==='workspace'){ S.ws='meridian'; }
  else { if(S.ws==='northpeak' && sc!=='first-run') S.ws='meridian'; }
  // scenario-specific openers
  if(sc==='partial'){ S.ws='meridian'; S.openRow='br1'; }
  if(sc==='blocked'){ S.ws='meridian'; S.openRow='br5'; S.focusCampaign='br5'; }
  if(sc==='approval'){ S.ws='meridian'; }
  if(sc==='active'){ S.ws='meridian'; S.openRow='br3'; }
  if(sc==='dossier'){ S.ws='meridian'; S.drawer='dossier'; S.drawerCampaign='br1'; }
  if(sc==='brief'){ S.ws='meridian'; S.drawer='brief'; S.brief={name:'Spring Masterclass launch',obj:'Fill the April cohort — 20 seats.'}; S.briefStage=5; S._forceSaveFail=true; }
  // reflect ws select
  el('c-ws').value=S.ws;
  syncNote(); render();
}
function syncNote(){ el('c-note').innerHTML=NOTES[S.scenario]||''; document.querySelectorAll('#c-steps button').forEach(b=>b.setAttribute('aria-current', b.dataset.sc===S.scenario)); }

/* ── build harness ─────────────────────────────────────────────────────────────────────────── */
function buildSteps(){
  el('c-steps').innerHTML=SCENARIOS.map(([sc,n,t,d])=>`<button data-sc="${sc}" role="tab" aria-current="${sc===S.scenario}"><i>${n}</i><span><b style="color:inherit">${t}</b></span></button>`).join('');
  document.querySelectorAll('#c-steps button').forEach(b=>b.onclick=()=>applyScenario(b.dataset.sc));
}

/* viewport sizing */
const VP={'1536x770':[1536,770],'1366x768':[1366,768],'1024x768':[1024,768],'900x1000':[900,1000]};
function sizeVp(){
  const [w,h]=VP[S.vp];
  const stage=document.querySelector('.rv-stage');
  const avail=stage.clientWidth-32, availH=stage.clientHeight-32-27; // minus cap
  const scale=Math.min(1, avail/w, availH/h);
  const frame=document.querySelector('.rv-frame');
  frame.style.width=w+'px';
  const vpEl=el('c-vp-el');
  vpEl.style.width=w+'px'; vpEl.style.height=h+'px';
  vpEl.style.containerType='inline-size'; vpEl.style.containerName='solo';
  frame.style.transform=`scale(${scale})`; frame.style.transformOrigin='top center';
  frame.style.marginBottom=(scale<1?`${-(h+27)*(1-scale)}px`:'0');
  el('c-dim').textContent=`${w} × ${h}${scale<1?'  ·  '+Math.round(scale*100)+'%':''}`;
}

/* controls */
el('c-th').onchange=e=>{S.theme=e.target.value; el('c-capt').textContent=S.theme==='light'?'Mineral (light)':'Obsidian (dark)'; render();};
el('c-vp').onchange=e=>{S.vp=e.target.value; render(); sizeVp();};
el('c-paige').onchange=e=>{S.paige=e.target.value; render(); sizeVp();};
el('c-ws').onchange=e=>{ // workspace switch clears volatile UI state
  S.ws=e.target.value; S.openRow=null; S.focusCampaign=null; S.drawer=null; S.drawerCampaign=null; S.brief=null; S.filters={phase:'all',src:'all',q:''}; S.save='idle';
  if(S.ws==='northpeak'){ S.surface=(S.scenario==='unavailable'||S.scenario==='loading')?S.surface:'first-run'; } else if(S.surface==='first-run'){ S.surface='ready'; }
  render();
};
el('c-rm').onclick=function(){S.rm=!S.rm;this.setAttribute('aria-pressed',S.rm);render();};
el('c-kb').onclick=function(){S.kb=!S.kb;this.setAttribute('aria-pressed',S.kb);document.querySelector('.rv-frame').style.outline=S.kb?'2px dashed var(--rv-focus)':'none';toast(S.kb?'Keyboard notes on: Tab cycles the desk; a drawer traps focus and Esc closes it, restoring focus to the trigger.':'Keyboard notes off','nav');};
['ap-a','ap-r','ap-x'].forEach(id=>el(id).onclick=function(){['ap-a','ap-r','ap-x'].forEach(x=>el(x).setAttribute('aria-pressed',x===id));el('ap-echo').textContent=`Decision: ${id==='ap-a'?'APPROVE':id==='ap-r'?'REVISE':'REJECT'} · ${el('ap-notes').value||'(no notes)'} — recorded locally in this prototype only.`;});

/* global keyboard: Escape closes a drawer; Tab is trapped inside it */
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.drawer){ e.preventDefault(); closeDrawer(); return; } trapTab(e); });
window.addEventListener('resize',sizeVp);

/* boot */
buildSteps(); syncNote(); render(); sizeVp();
</script>
