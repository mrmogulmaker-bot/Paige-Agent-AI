    <g transform="translate(0 48)"><circle cx="35" cy="105.5" r="7" fill="none" stroke="#a7a0aa"/><circle cx="32" cy="103" r="2" fill="#a7a0aa"/><circle cx="38" cy="108" r="2" fill="#a7a0aa"/><text x="57" y="111">Clients</text></g>
