  <path d="M1050 543h359" class="line"/><rect x="1051" y="557" width="24" height="24" rx="6" fill="#211c28" stroke="#3b3444"/><text x="1063" y="573" text-anchor="middle" class="ui champ meta">M</text><text x="1086" y="567" class="ui meta ink strong">MIRAEL</text><text x="1086" y="583" class="ui meta faint">Checking client commitments</text><circle cx="1358" cy="569" r="3" fill="#8e7de7"/><text x="1370" y="573" class="ui status" fill="#8e7de7">Working</text>
  <path d="M1038 661h384" class="line"/><rect x="1040" y="681" width="23" height="23" rx="6" fill="#211c28" stroke="#3b3444"/><text x="1051.5" y="697" text-anchor="middle" class="ui champ meta">Z</text><text x="1074" y="696" class="ui meta ink strong">ZION · DIRECT ADDRESS</text><text x="1040" y="726" class="ui small muted">@ZION can revise the workflow here. PAIGE remains</text><text x="1040" y="746" class="ui small muted">the orchestrator and synthesizes the result.</text>
  <rect x="1035" y="774" width="390" height="47" rx="9" fill="#16131a" stroke="#3b3444"/><rect x="1042" y="780" width="35" height="35" rx="7" fill="#292330"/><text x="1059.5" y="803" text-anchor="middle" class="ui ink">◉</text><text x="1087" y="795" class="ui small ink strong">Voice ready</text><text x="1087" y="811" class="ui meta faint">Transcript and work remain visible</text>
