  <rect x="844" y="12" width="83" height="34" rx="8" class="btn"/><text x="885.5" y="34" text-anchor="middle" class="ui muted small">Activity · 4</text><rect x="937" y="12" width="67" height="34" rx="8" fill="#251f19" stroke="#685536"/><circle cx="953" cy="29" r="7" fill="url(#orb)"/><text x="966" y="34" class="ui ink meta strong">PAIGE</text>
  <g transform="translate(265 112)" class="ui">
    <text class="label champ">FRIDAY · REPRESENTATIVE DESIGN DATA</text><text y="49" class="title ink">Good morning, Antonio.</text><text y="79" class="body muted">Three decisions can clear the path for everything else.</text>
    <path d="M0 122h706" class="line"/><text y="165" class="faint h2">01</text><text x="96" y="154" class="label champ">OWNER DECISION · CLIENT COMMITMENT</text><text x="96" y="185" class="h2 ink">Review the Anderson proposal</text><text x="96" y="214" class="body muted">Promised Friday. OATHEN completed a representative standards review;</text><text x="96" y="236" class="body muted">PAIGE is waiting for your approval to send.</text>
    <rect x="96" y="262" width="171" height="38" rx="7" fill="#e8c98e"/><text x="181.5" y="286" text-anchor="middle" fill="#17120c" class="small strong">Review with PAIGE  →</text><text x="288" y="286" class="small champ strong">Open account</text><path d="M0 328h706" class="line"/>
    <text y="375" class="h2 ink">In motion</text><text x="395" y="375" text-anchor="end" class="meta faint">3 items</text>
    <g transform="translate(0 395)"><path d="M0 0h400" class="line"/><rect x="0" y="18" width="29" height="29" rx="7" fill="#201b27"/><text x="14.5" y="38" text-anchor="middle" class="champ">↗</text><text x="43" y="31" class="small ink strong">Advisory launch campaign</text><text x="43" y="49" class="meta faint">KAVYN drafting · representative activity</text><text x="388" y="37" class="muted">→</text></g>
    <g transform="translate(0 461)"><path d="M0 0h400" class="line"/><rect x="0" y="18" width="29" height="29" rx="7" fill="#201b27"/><text x="14.5" y="38" text-anchor="middle" class="champ">↗</text><text x="43" y="31" class="small ink strong">Client delivery workflow</text><text x="43" y="49" class="meta faint">ZION building · representative activity</text><text x="388" y="37" class="muted">→</text></g>
    <text x="448" y="375" class="h2 ink">Business pulse</text><text x="706" y="375" text-anchor="end" class="meta faint">NOT VERIFIED</text><path d="M448 396v90" stroke="#e8b976" stroke-width="2"/><text x="466" y="418" class="small muted">Calendar and email are not connected,</text><text x="466" y="438" class="small muted">so PAIGE cannot confirm recent replies</text><text x="466" y="458" class="small muted">or upcoming commitments.</text><rect x="466" y="478" width="114" height="33" rx="7" class="btn"/><text x="523" y="499" text-anchor="middle" class="meta muted strong">Connect sources</text>
  </g>
