<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">PAIGE tenant Command Spine visual preview</title>
  <desc id="desc">A desktop visual showing six-item tenant navigation, the morning command center, and an expanded PAIGE conversation with active work.</desc>
  <defs>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e6bd"/><stop offset=".45" stop-color="#e8c98e"/><stop offset="1" stop-color="#8e7de7"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#fff4d8"/><stop offset=".38" stop-color="#e8c98e"/><stop offset="1" stop-color="#332616"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="-18" dy="0" stdDeviation="28" flood-opacity=".34"/></filter>
    <style>
      .ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase}.muted{fill:#a7a0aa}.faint{fill:#77717d}.ink{fill:#f5f1e9}.champ{fill:#e8c98e}.body{font-size:14px}.small{font-size:12px}.title{font-size:34px;font-weight:500;letter-spacing:-1px}.h2{font-size:19px;font-weight:600;letter-spacing:-.3px}.strong{font-weight:600}.line{stroke:#2d2835}.hair{stroke:#3b3444}.btn{fill:#191621;stroke:#3b3444}.nav{font-size:14px}.meta{font-size:11px}.status{font-size:11px;font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,monospace}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#0c0a11"/>
