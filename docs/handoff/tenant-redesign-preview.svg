  <text x="1230" y="178" text-anchor="middle" class="ui faint meta">◷ Session resumed · 11 minutes ago</text>
  <path d="M1060 203v64" stroke="#3b3444" stroke-width="2"/><text x="1075" y="224" class="ui meta faint">YOU</text><text x="1075" y="247" class="ui body ink">Reprioritize my day around the work</text><text x="1075" y="268" class="ui body ink">that matters most.</text>
  <circle cx="1048" cy="308" r="11" fill="#221a17" stroke="#7d6640"/><circle cx="1048" cy="308" r="4" fill="url(#orb)"/><text x="1067" y="312" class="ui meta ink strong" letter-spacing="1">PAIGE</text><text x="1040" y="345" class="ui body ink">I’ve moved the Anderson proposal review ahead</text><text x="1040" y="368" class="ui body ink">of internal planning. Two commitments need your</text><text x="1040" y="391" class="ui body ink">decision; nothing moves without approval.</text>
