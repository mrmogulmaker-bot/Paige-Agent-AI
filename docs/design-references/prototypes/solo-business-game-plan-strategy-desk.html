<style>
/* ============================================================================
   Business Game Plan — Solo Command Center STRATEGY-DESK reimagination.
   Throwaway, read-only Flow-Prototype (§69/flow-prototype). Design/prototype
   ONLY — no production src/schema/route/contract touched. Stop at Gate 1.

   §00: this ports the ALREADY-SHIPPED, owner-approved `.paige-solo` design
   system (src/solo/solo-tokens.css + solo-game-plan-workspace.css) VERBATIM —
   it invents no visual direction. CC owns IA / states / source-honesty / a11y.
   Every value carries a SOURCE-CLASS chip (fact / your direction / Paige
   suggests / assumption / source unavailable / proof owed). All data is
   FICTIONAL and labeled; the tenant "Clearpath Advisory" is a made-up,
   universal consulting firm (§63 — never a real owner account). Gold is spent
   ONLY on the one primary act.
   ========================================================================== */

/* ---- PRODUCT TOKENS — mirrored verbatim from src/solo/solo-tokens.css ---- */
.paige-solo{
  --font:'Geist','Söhne',-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
  --canvas:#F6F5F1;--surface:#FFFFFF;--surface-2:#FBFAF7;--surface-sunk:#F0EEE8;
  --line:#E5E1D8;--line-soft:#EFECE4;
  --ink:#171331;--ink-2:#4A4566;--ink-3:#7E7995;--ink-inv:#FBFAF7;
  --rail:#171331;--rail-2:#221C46;--rail-line:#332C5E;--rail-text:#C9C4E0;
  --gold:#C9860C;--gold-bright:#E9A83A;--gold-tint:#FBF1DE;--gold-line:#EFDCB4;
  --violet:#5B3FD6;--violet-2:#7A62E8;--violet-tint:#EEEAFD;--violet-line:#DAD1FA;
  --ok:#1B7A52;--ok-tint:#E4F2EB;--warn:#B4700A;--warn-tint:#FBF0DD;--bad:#B93E37;--bad-tint:#FAE9E7;
  --r-s:8px;--r-m:12px;--r-l:18px;--r-xl:26px;
  --sh-1:0 1px 2px rgba(23,19,49,.05);
  --sh-2:0 2px 4px rgba(23,19,49,.04),0 12px 28px -12px rgba(23,19,49,.14);
  --sh-3:0 24px 60px -18px rgba(23,19,49,.28);
}
.paige-solo[data-theme="dark"]{
  --canvas:#0C0A1B;--surface:#141129;--surface-2:#191637;--surface-sunk:#100D24;
  --line:#282348;--line-soft:#221D3E;
  --ink:#EFECFA;--ink-2:#B0AACB;--ink-3:#7D779A;--ink-inv:#141129;
  --rail:#100D24;--rail-2:#1B1738;--rail-line:#282348;--rail-text:#B0AACB;
  --gold:#E9A83A;--gold-bright:#F5C266;--gold-tint:#2C2211;--gold-line:#4A3A17;
  --violet:#8A72F5;--violet-2:#A692FF;--violet-tint:#221C4A;--violet-line:#352C68;
  --ok:#4CC48C;--ok-tint:#12301F;--warn:#E3A63C;--warn-tint:#2E2311;--bad:#EE7A72;--bad-tint:#331817;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 2px 4px rgba(0,0,0,.25),0 12px 28px -12px rgba(0,0,0,.5);
  --sh-3:0 24px 60px -18px rgba(0,0,0,.6);
}

/* ---- REVIEW CHROME (separate, deliberately-single-look technical skin) ---- */
:root{
  --rv-bg:#0b0a12;--rv-panel:#14131f;--rv-panel-2:#1c1b2b;--rv-line:#2a2940;
  --rv-text:#d7d4e6;--rv-text-2:#8f8bad;--rv-accent:#8A72F5;--rv-gold:#E9A83A;--rv-ok:#4CC48C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--rv-bg);color:var(--rv-text);
  font-family:'Geist','Söhne',-apple-system,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100%;
}
.rv-topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 15px;background:linear-gradient(180deg,#14131f,#100f18);
  border-bottom:1px solid var(--rv-line);position:sticky;top:0;z-index:40;
}
.rv-brand{display:flex;align-items:center;gap:9px;padding-right:11px;border-right:1px solid var(--rv-line)}
.rv-mark{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--rv-accent),#5B3FD6);color:#fff;font-weight:800;font-size:12px}
.rv-brand b{font-size:13px;letter-spacing:-.01em;display:block}
.rv-brand span{font-size:10.5px;color:var(--rv-text-2)}
.rv-group{display:flex;align-items:center;gap:6px}
.rv-label{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--rv-text-2);margin-right:1px}
.rv-seg{display:inline-flex;background:var(--rv-panel-2);border:1px solid var(--rv-line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.rv-seg button{font:inherit;font-size:11.5px;color:var(--rv-text-2);background:none;border:0;padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.rv-seg button:hover{color:var(--rv-text)}
.rv-seg button[aria-pressed="true"]{background:var(--rv-accent);color:#fff}
.rv-seg button.rv-warn[aria-pressed="true"]{background:var(--rv-gold);color:#231a06}
.rv-spacer{flex:1 1 auto;min-width:8px}
.rv-note{font-size:11px;color:var(--rv-text-2);max-width:340px}
.rv-note b{color:var(--rv-gold);font-weight:600}
.rv-toggle{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--rv-text-2);cursor:pointer;user-select:none}
.rv-toggle input{accent-color:var(--rv-accent);width:15px;height:15px}
.rv-linkbtn{font:inherit;font-size:11.5px;color:var(--rv-accent);background:none;border:1px solid var(--rv-line);border-radius:8px;padding:5px 9px;cursor:pointer}
.rv-linkbtn:hover{background:var(--rv-panel-2)}
.rv-topbar :focus-visible,.rv-stage :focus-visible{outline:2px solid var(--rv-accent);outline-offset:2px}

.rv-stage{flex:1 1 auto;min-height:0;overflow:auto;padding:22px;display:grid;place-items:start center;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(122,98,232,.10), transparent 60%),
    repeating-linear-gradient(45deg,transparent,transparent 11px,rgba(255,255,255,.012) 11px,rgba(255,255,255,.012) 12px);
}
.rv-frame-wrap{display:flex;flex-direction:column;gap:9px;align-items:center}
.rv-frame-meta{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--rv-text-2)}
.rv-frame-meta .fd{width:6px;height:6px;border-radius:50%;background:var(--rv-accent)}
.rv-device{border-radius:15px;overflow:hidden;background:#000;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06);
  transition:width .3s cubic-bezier(.22,1,.36,1),height .3s cubic-bezier(.22,1,.36,1);}
/* the app viewport — container-type makes the surface reflow to the SIMULATED device width
   (not the real browser window), so the viewport switch faithfully shows responsive behavior. */
.appviewport{width:100%;height:100%;overflow:hidden;background:var(--canvas);container-type:inline-size}

/* ================= SOLO SHELL (minimal, faithful to SoloApp) ================= */
.paige-solo{height:100%;display:flex;background:var(--canvas);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.paige-solo *{box-sizing:border-box}
.paige-solo h1,.paige-solo h2,.paige-solo h3,.paige-solo h4{margin:0;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.paige-solo p{margin:0}
/* reset stays font/cursor only — must NOT set border/background (the element selector would
   out-specify class rules and strip the gold act fill — the documented cascade collision). */
.paige-solo button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
.paige-solo a{color:var(--violet);text-decoration:none}
/* the [hidden] attribute must win over component display rules (e.g. .pdock{display:flex}),
   matching the Artifact host reset so the dock hides in the committed file too. */
.paige-solo [hidden]{display:none!important}
.paige-solo .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.paige-solo ::-webkit-scrollbar{width:9px;height:9px}
.paige-solo ::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}

/* left nav rail (context only) */
.snav{flex:0 0 auto;width:60px;background:var(--rail);border-right:1px solid var(--rail-line);
  display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;color:var(--rail-text)}
.snav .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px;
  background:linear-gradient(135deg,#7A62E8,#5B3FD6);color:#fff;font-weight:800;font-size:14px}
.snav .nItem{width:40px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--rail-text);opacity:.72}
.snav .nItem.active{background:rgba(255,255,255,.10);opacity:1;color:#fff}
.snav .nItem svg{width:18px;height:18px}
.snav .nspring{flex:1}
@container (max-width:820px){.snav{display:none}}

.smain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* command-center tab strip — faithful to CommandHub's 4-surface order */
.cctabs{flex:0 0 auto;display:flex;align-items:stretch;min-height:44px;
  padding:0 clamp(14px,2.2vw,30px);gap:4px;background:var(--surface);border-bottom:1px solid var(--line)}
.cctabs button{position:relative;display:inline-flex;align-items:center;gap:7px;border:0;padding:0 11px;
  background:transparent;color:var(--ink-3);font-size:11.5px;font-weight:650;cursor:pointer;white-space:nowrap}
.cctabs button .tdot{width:15px;height:15px;display:grid;place-items:center;color:currentColor}
.cctabs button .tdot svg{width:15px;height:15px}
.cctabs button.active{color:var(--ink)}
.cctabs button.active::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;background:var(--gold);border-radius:2px 2px 0 0}
.cctabs button.reserved{color:var(--ink-3);opacity:.55;cursor:default}
.cctabs button.reserved .rzz{font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--ink-3);border:1px dashed var(--line);border-radius:5px;padding:1px 4px}
.cctabs button:focus-visible{outline:2px solid var(--violet);outline-offset:-3px;border-radius:6px}

.deskhost{flex:1;min-height:0;min-width:0;display:flex;overflow:hidden}

/* Paige dock (right) — the ONE authenticated Paige conversation, docked. Narrows the field when open. */
.pdock{flex:0 0 340px;width:340px;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--rail),var(--rail-2));border-left:1px solid var(--rail-line);color:var(--rail-text)}
@container (max-width:1120px){.pdock{flex-basis:300px;width:300px}}
@container (max-width:900px){.pdock{display:none}}
.pdock-hd{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--rail-line)}
.pdock-hd .pav{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#7A62E8,#5B3FD6);color:#fff;font-weight:800;font-size:12px}
.pdock-hd b{color:#EFECFA;font-size:13px}
.pdock-hd span{font-size:10.5px;color:var(--rail-text)}
.pdock-hd .pcls{margin-left:auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--rail-text)}
.pdock-hd .pcls:hover{background:rgba(255,255,255,.08);color:#fff}
.pdock-body{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:11px}
.pmsg{max-width:88%;padding:9px 11px;border-radius:12px;font-size:12.5px;line-height:1.5}
.pmsg-p{align-self:flex-start;background:rgba(255,255,255,.06);color:#E4E1F2;border:1px solid var(--rail-line)}
.pmsg-u{align-self:flex-end;background:var(--violet);color:#fff}
.pmsg-lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-text);margin-bottom:3px}
.pdock-foot{flex:0 0 auto;padding:12px 14px;border-top:1px solid var(--rail-line);display:flex;flex-direction:column;gap:9px}
.pcompose{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--rail-line);border-radius:11px;padding:9px 11px}
.pcompose input{flex:1;min-width:0;background:none;border:0;color:#EFECFA;font:inherit;font-size:12.5px;outline:none}
.pcompose input::placeholder{color:var(--rail-text)}
.pcompose .psend{width:28px;height:28px;border-radius:8px;background:var(--violet);color:#fff;display:grid;place-items:center;flex:none}
.pcompose .psend svg{width:15px;height:15px}
/* the proposal-review card inside the dock */
.prev{background:rgba(255,255,255,.05);border:1px solid var(--rail-line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px}
.prev-hd{display:flex;align-items:center;gap:8px}
.prev-hd .pr-ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--violet-tint);color:var(--violet-2)}
.prev-hd .pr-ic svg{width:14px;height:14px}
.prev-hd b{color:#EFECFA;font-size:12.5px}
.prev-prov{font-size:10.5px;color:var(--rail-text)}
.prev-diff{font-size:12px;color:#D7D3EC;line-height:1.5;background:rgba(0,0,0,.18);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.prev-diff .dl{display:flex;gap:7px}
.prev-diff .dl .dm{flex:none;width:14px;font-weight:800}
.prev-diff .dl.add .dm{color:var(--ok)}
.prev-diff .dl.rm .dm{color:var(--bad)}
.prev-diff .dl.rm span{opacity:.6;text-decoration:line-through}
.prev-cta{display:flex;gap:7px;flex-wrap:wrap}

/* ================= STRATEGY DESK ================= */
.sd{flex:1;min-height:0;min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);
  gap:12px;padding:14px clamp(14px,2.2vw,28px) 16px;overflow:hidden}
.sd *{box-sizing:border-box}

/* kicker + primary act */
.sd-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.sd-kicker{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sd-kicker .sep{opacity:.5}
.sd-h1{font-size:clamp(18px,2vw,23px);letter-spacing:-.025em;margin-top:6px;text-wrap:balance}
.sd-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;max-width:66ch;line-height:1.5}
.sd-acts{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}

/* buttons (gp-btn parity; gold ONLY on .sd-act) */
.sd-btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:10px;
  font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:background .15s,transform .12s,box-shadow .15s;white-space:nowrap}
.sd-btn:hover{background:var(--surface-sunk)}
.sd-btn:active{transform:translateY(1px)}
.sd-btn svg{width:15px;height:15px}
.sd-btn-sm{height:29px;padding:0 10px;font-size:12px;border-radius:9px}
.sd-btn-quiet{background:transparent}
.sd-act{background:var(--gold);border-color:var(--gold);color:#231703;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.paige-solo[data-theme="dark"] .sd-act{color:#20180a}
.sd-act:hover{background:var(--gold-bright)}
.sd-btn:focus-visible,.sd-act:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

/* horizon navigator */
.sd-horizon{display:flex;align-items:center;gap:10px;min-width:0}
.sd-hz-strip{display:flex;gap:3px;background:var(--surface-sunk);border-radius:11px;padding:3px;overflow-x:auto;min-width:0}
.sd-hz-strip::-webkit-scrollbar{height:0}
.sd-hz{flex:none;display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:6px 11px;border-radius:8px;color:var(--ink-3);white-space:nowrap;border:0;background:none;text-align:left}
.sd-hz .hzt{font-size:12px;font-weight:650;color:inherit}
.sd-hz .hzs{font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);opacity:.8}
.sd-hz:hover{color:var(--ink)}
.sd-hz[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.sd-hz[aria-pressed="true"] .hzs{color:var(--violet)}
.sd-hz:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
.sd-hz-meta{flex:none;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3)}
.sd-hz-meta .mlbl{font-weight:600;color:var(--ink-2)}
@container (max-width:900px){.sd-hz-meta{display:none}}

/* operating field: strategy spine | operating rail */
.sd-field{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:14px;min-height:0}
.sd-col,.sd-rail{min-height:0;display:flex;flex-direction:column;gap:12px;overflow:auto;padding-right:2px}
/* scroll-owner children keep their natural height (a card with overflow:hidden would otherwise be
   crushed by flex-shrink when the column overflows) — the column scrolls instead. */
.sd-col>*,.sd-rail>*{flex:0 0 auto}
@container (max-width:1040px){
  .sd-field{grid-template-columns:minmax(0,1fr);overflow:auto}
  .sd-col,.sd-rail{overflow:visible}
}

/* cards */
.sd-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.sd-card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px 10px}
.sd-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sd-eyebrow svg{width:14px;height:14px}

/* SOURCE-CLASS chips — the honesty vocabulary (every value carries one) */
.sd-src{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:99px;
  font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap;flex:none}
.sd-src .sdd{width:5px;height:5px;border-radius:50%;background:currentColor}
.sd-src-fact{background:var(--ok-tint);color:var(--ok)}
.sd-src-dir{background:var(--violet-tint);color:var(--violet)}
.sd-src-rec{background:var(--surface-sunk);color:var(--violet-2)}
.sd-src-assume{background:var(--warn-tint);color:var(--warn)}
.sd-src-unavail{background:var(--surface-sunk);color:var(--ink-3)}
.sd-src-owed{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
.sd-src-blocked{background:var(--bad-tint);color:var(--bad)}

/* Plan Brief (the strategic spine's lead) */
.sd-brief{border:1px solid var(--violet-line);box-shadow:var(--sh-2);position:relative;overflow:hidden}
.sd-brief::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--violet),var(--violet-2),transparent)}
.sd-brief-in{padding:14px 16px 15px;display:flex;flex-direction:column;gap:11px}
.sd-brief-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sd-approved{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ok)}
.sd-approved svg{width:13px;height:13px}
.sd-brief h2{font-size:clamp(16px,1.7vw,20px);letter-spacing:-.02em;text-wrap:balance;line-height:1.25}
.sd-brief .bd-outcome{font-size:13px;color:var(--ink-2);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.sd-brief .bd-outcome svg{width:16px;height:16px;flex:none;color:var(--violet);margin-top:2px}
.sd-brief .bd-outcome b{color:var(--ink);font-weight:600}
.sd-bd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@container (max-width:520px){.sd-bd-grid{grid-template-columns:minmax(0,1fr)}}
.sd-bd-cell{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:9px 11px}
.sd-bd-cell .bl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px;justify-content:space-between}
.sd-bd-cell .bv{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.45}
.sd-bd-cell ul{margin:5px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.sd-bd-cell li{font-size:12.5px;color:var(--ink);display:flex;gap:7px;align-items:flex-start}
.sd-bd-cell li .lm{flex:none;color:var(--ink-3);font-family:var(--mono);font-size:11px;margin-top:1px}

/* generic expandable rows (pillars/plays/decisions/missions) */
.sd-list{display:flex;flex-direction:column}
.sd-item{border-top:1px solid var(--line-soft)}
.sd-item:first-child{border-top:0}
.sd-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:start;
  width:100%;text-align:left;background:none;border:0;padding:11px 15px;cursor:pointer}

.sd-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:1px;background:var(--surface-sunk);color:var(--ink-3)}

.sd-ic.v{background:var(--violet-tint);color:var(--violet)}
.sd-ic.ok{background:var(--ok-tint);color:var(--ok)}
.sd-ic.warn{background:var(--warn-tint);color:var(--warn)}
.sd-ic.bad{background:var(--bad-tint);color:var(--bad)}
.sd-main{min-width:0}
.sd-title{font-size:13.5px;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.sd-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.sd-caret{flex:none;color:var(--ink-3);transition:transform .2s;width:28px;height:28px;display:grid;place-items:center;border-radius:8px}
.sd-caret:hover{background:var(--surface-sunk);color:var(--ink)}
.sd-caret:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
.sd-caret svg{width:17px;height:17px}
.sd-item[data-open="true"] .sd-caret{transform:rotate(180deg)}
.sd-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s cubic-bezier(.22,1,.36,1)}

/* collapsed detail is height-clipped to 0 — also make it invisible so its buttons leave the
   tab order + a11y tree (a focus ring on a 0px-clipped control would be invisible). */
.sd-item:not([data-open="true"]) .sd-detail>div{visibility:hidden}
.sd-item[data-open="true"] .sd-detail>div{visibility:visible}
.sd-detail-in{padding:2px 15px 13px 54px;display:flex;flex-direction:column;gap:9px}
.sd-fact{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;font-size:12.5px;align-items:start}

.sd-detail-cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}

/* "not defined yet" honest placeholder */
.sd-todo{padding:11px 15px 11px 54px;font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line-soft)}

/* a text action that reads like a link but is a real (keyboard-operable) button */
.sd-inline-link{color:var(--violet);font-weight:600;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.sd-inline-link:hover{color:var(--violet-2);text-decoration:underline}
.sd-inline-link:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:3px}

/* campaign play card (a play with the full field set) */
.sd-play{border-top:1px solid var(--line-soft);padding:0}
.sd-play-blocked{background:var(--bad-tint)}

/* dependency (Systems Check demoted) */
.sd-dep{border:1px solid var(--line)}
.sd-dep .sd-card-hd{cursor:pointer}
.sd-dep-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease}
.sd-dep[data-open="true"] .sd-dep-body{grid-template-rows:1fr}
.sd-dep-body>div{overflow:hidden}
.sd-dep:not([data-open="true"]) .sd-dep-body>div{visibility:hidden}
.sd-dep[data-open="true"] .sd-dep-body>div{visibility:visible}
.sd-dep-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 15px;border-top:1px solid var(--line-soft);width:100%;text-align:left;background:none;cursor:pointer}
.sd-dep-row:hover{background:var(--surface-2)}
.sd-dep-row:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
.sd-dep-ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--bad-tint);color:var(--bad)}
.sd-dep-ic svg{width:14px;height:14px}
.sd-dep-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.sd-dep-note{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.sd-dep-go{font-size:11.5px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:4px;white-space:nowrap}
.sd-dep-go svg{width:14px;height:14px}
.sd-dep-count{font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-tint);border-radius:99px;padding:2px 8px}

/* Paige contribution + alignment */
.sd-partner{background:linear-gradient(135deg,var(--rail),var(--rail-2));border-color:var(--rail-line)}
.sd-partner .sd-eyebrow{color:#B9B2E0}
.sd-partner-in{padding:0 15px 14px;display:flex;flex-direction:column;gap:10px}
.sd-align{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--rail-line);border-radius:10px;padding:9px 11px}
.sd-align .al-ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:rgba(122,98,232,.2);color:#C9C4E0}
.sd-align .al-ic svg{width:14px;height:14px}
.sd-align .al-t{font-size:12px;color:#E4E1F2;font-weight:600}
.sd-align .al-s{font-size:10.5px;color:var(--rail-text)}
.sd-align .al-hist{margin-left:auto;font-size:11px;font-weight:600;color:#C9C4E0;background:rgba(255,255,255,.06);border:1px solid var(--rail-line);border-radius:8px;padding:5px 8px;white-space:nowrap}
.sd-align .al-hist:hover{background:rgba(255,255,255,.12);color:#fff}
.sd-contrib{display:flex;flex-direction:column;gap:7px}
.sd-contrib .cr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;
  background:rgba(255,255,255,.04);border:1px solid var(--rail-line);border-radius:9px;padding:8px 10px}
.sd-contrib .cr .ci{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);color:#C9C4E0}
.sd-contrib .cr .ci svg{width:13px;height:13px}
.sd-contrib .cr .ct{font-size:12px;color:#E4E1F2}
.sd-contrib .cr .cl{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rail-text);white-space:nowrap}
.sd-contrib .honest{font-size:11px;color:var(--rail-text);line-height:1.45;padding:2px 2px 0;display:flex;gap:7px}
.sd-contrib .honest svg{width:13px;height:13px;flex:none;margin-top:2px}

/* empty first-run hero */
.sd-first{grid-row:1 / -1;display:grid;place-items:center;padding:10px;overflow:auto}
.sd-first-in{max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.sd-first-badge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#7A62E8,#5B3FD6);color:#fff;box-shadow:var(--sh-2)}
.sd-first-badge svg{width:26px;height:26px}
.sd-first h1{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em}
.sd-first p{font-size:13.5px;color:var(--ink-2);max-width:52ch;line-height:1.55}
.sd-first-steps{display:grid;gap:9px;width:100%;max-width:470px;text-align:left;margin-top:4px}
.sd-first-step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);width:100%;text-align:left;cursor:pointer}
.sd-first-step:hover{background:var(--surface-2)}
.sd-first-step:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.sd-first-step .num{width:22px;height:22px;border-radius:7px;background:var(--violet-tint);color:var(--violet);display:grid;place-items:center;font-weight:800;font-size:11px;font-family:var(--mono)}
.sd-first-step .st b{font-size:13px;font-weight:600;color:var(--ink);display:block}
.sd-first-step .st span{font-size:11.5px;color:var(--ink-3)}
.sd-first-step .go{color:var(--ink-3);display:flex}
.sd-first-step .go svg{width:16px;height:16px}

/* skeleton / error / freshness */
.sd-sk{background:linear-gradient(90deg,var(--surface-sunk) 25%,var(--line-soft) 37%,var(--surface-sunk) 63%);
  background-size:400% 100%;animation:sd-shim 1.3s ease infinite;border-radius:7px}
@keyframes sd-shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sd-errbox{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sd-errbox .ei{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--bad-tint);color:var(--bad)}
.sd-errbox .ei svg{width:19px;height:19px}
.sd-errbox h3{font-size:14px}
.sd-errbox p{font-size:12.5px;color:var(--ink-3);max-width:42ch;line-height:1.45}
.sd-fresh{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--warn);background:var(--warn-tint);border-radius:99px;padding:2px 8px}
.sd-fresh svg{width:12px;height:12px}

/* attention banner (owner-decision-waiting / blocked / stale / proposal) */
.sd-banner{grid-column:1 / -1;display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:var(--r-m);font-size:12.5px}
.sd-banner svg{width:17px;height:17px;flex:none}
.sd-banner .bt{color:var(--ink);font-weight:600}
.sd-banner .bs{color:var(--ink-2)}
.sd-banner .bact{margin-left:auto;flex:none}
.sd-banner-decide{background:var(--violet-tint);border:1px solid var(--violet-line);color:var(--violet)}
.sd-banner-block{background:var(--bad-tint);border:1px solid var(--bad);color:var(--bad)}
.sd-banner-stale{background:var(--warn-tint);border:1px solid var(--gold-line);color:var(--warn)}
.sd-banner-prop{background:var(--violet-tint);border:1px solid var(--violet-line);color:var(--violet)}

/* reveal (from a visible rest; disabled under reduced motion / rm flag) */
.sd .sd-card,.sd-brief,.sd-top,.sd-horizon{animation:sd-rise .5s cubic-bezier(.22,1,.36,1) backwards}
.sd .sd-rail>*:nth-child(2){animation-delay:.05s}
.sd .sd-rail>*:nth-child(3){animation-delay:.1s}
@keyframes sd-rise{from{opacity:0;transform:translateY(8px)}}
.paige-solo.rm .sd *,.paige-solo.rm .sd-card,.paige-solo.rm .sd-brief{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  .paige-solo .sd *,.paige-solo .sd-card,.paige-solo .sd-brief,.paige-solo .sd-dcard,.paige-solo .sd-swipe-fg,
  .paige-solo .ov-scrim,.paige-solo .ov-sheet,.paige-solo .toast,.paige-solo .sd-dcard .dc-hint{animation:none!important;transition:none!important}
}

/* ================= LIVING AREAS: edit affordance + swipe deck ================= */
/* every area is editable by the owner AND updatable by Paige — never a locked block */
.sd-edit{width:27px;height:27px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink-3);border:1px solid transparent;flex:none}
.sd-edit:hover{background:var(--surface-sunk);color:var(--ink)}
.sd-edit:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
.sd-edit svg{width:15px;height:15px}
.sd-living{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.sd-living svg{width:12px;height:12px;color:var(--violet)}
.sd-hdacts{display:flex;align-items:center;gap:6px}

/* swipe deck — a stack you swipe away (mouse or touch), next card pops up */
.sd-deck{padding:12px 15px 14px;display:flex;flex-direction:column;gap:11px}
.sd-deck-stack{position:relative;touch-action:pan-y}
.sd-dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-1);
  padding:13px 14px;display:flex;flex-direction:column;gap:9px;min-height:172px}
.sd-dcard.peek{position:absolute;inset:0;pointer-events:none;z-index:1}
.sd-dcard.peek1{transform:translateY(9px) scale(.965);opacity:.6}
.sd-dcard.peek2{transform:translateY(18px) scale(.93);opacity:.32}
.sd-dcard.top{position:relative;z-index:3;cursor:grab;touch-action:pan-y;transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .28s}
.sd-dcard.top.dragging{transition:none;cursor:grabbing}
.sd-dcard.gone-left{transform:translateX(-140%) rotate(-11deg)!important;opacity:0!important}
.sd-dcard.gone-right{transform:translateX(140%) rotate(11deg)!important;opacity:0!important}
.paige-solo.rm .sd-dcard.top{transition:none}
.sd-dcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.sd-dcard-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-sunk);color:var(--ink-3)}
.sd-dcard-ic.v{background:var(--violet-tint);color:var(--violet)}
.sd-dcard-ic.ok{background:var(--ok-tint);color:var(--ok)}
.sd-dcard-ic.warn{background:var(--warn-tint);color:var(--warn)}
.sd-dcard-ic svg{width:15px;height:15px}
.sd-dcard h4{font-size:14px;letter-spacing:-.01em;line-height:1.3;text-wrap:balance}
.sd-dcard .dc-note{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.sd-dcard .dc-ev{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start;margin-top:auto}
.sd-dcard .dc-ev svg{width:13px;height:13px;flex:none;margin-top:1px}
.sd-dcard .dc-acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:2px}
/* drag intent labels that fade in on the card as you pull it */
.sd-dcard .dc-hint{position:absolute;top:12px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 8px;border-radius:7px;opacity:0;transition:opacity .12s}
.sd-dcard .dc-hint.l{right:12px;color:var(--ink-3);background:var(--surface-sunk)}
.sd-dcard .dc-hint.r{left:12px;color:var(--ok);background:var(--ok-tint)}
.paige-solo.rm .sd-dcard .dc-hint{transition:none}
.sd-deck-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sd-deck-dots{display:flex;gap:5px;align-items:center}
.sd-deck-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.sd-deck-dots i.on{background:var(--violet);width:16px;border-radius:3px}
.sd-deck-count{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.sd-deck-swipehint{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sd-deck-swipehint svg{width:14px;height:14px}
.sd-deck-empty{padding:24px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.sd-deck-empty .de-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--ok-tint);color:var(--ok)}
.sd-deck-empty .de-ic svg{width:19px;height:19px}
.sd-deck-empty h4{font-size:14px}
.sd-deck-empty p{font-size:12.5px;color:var(--ink-3);max-width:34ch}

/* swipe-to-dismiss on an individual row (missions) */
.sd-swipe{position:relative;overflow:hidden}
.sd-swipe-under{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;
  background:var(--surface-sunk);color:var(--ink-3);font-size:11.5px;font-weight:600;gap:6px}
.sd-swipe-under svg{width:14px;height:14px}
.sd-swipe-fg{position:relative;z-index:1;background:var(--surface);touch-action:pan-y;transition:transform .26s cubic-bezier(.22,1,.36,1),opacity .26s}
.sd-swipe-fg.dragging{transition:none}
.sd-swipe.gone .sd-swipe-fg{transform:translateX(-102%);opacity:0}
.paige-solo.rm .sd-swipe-fg{transition:none}

/* ================= OVERLAYS (drawers / popouts) ================= */
.ov-scrim{position:fixed;inset:0;z-index:60;background:rgba(12,10,27,.5);backdrop-filter:blur(3px);
  display:grid;opacity:0;transition:opacity .2s}
.ov-scrim.show{opacity:1}
.paige-solo.rm .ov-scrim{transition:none}

.ov-scrim[data-kind="modal"].show .ov-sheet{transform:none}
.paige-solo.rm .ov-sheet{transition:none!important;transform:none!important}
.ov-hd{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.ov-hd .oh-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--violet-tint);color:var(--violet)}
.ov-hd .oh-ic svg{width:16px;height:16px}
.ov-hd h3{font-size:15px}
.ov-hd .oh-sub{font-size:11.5px;color:var(--ink-3)}
.ov-hd .oh-x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.ov-hd .oh-x:hover{background:var(--surface-sunk);color:var(--ink)}
.ov-hd .oh-x svg{width:17px;height:17px}
.ov-body{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:13px}
.ov-foot{flex:0 0 auto;display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.ov-field{display:flex;flex-direction:column;gap:6px}
.ov-field label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ov-field .fin{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);line-height:1.5}

.ov-legend .lg .lgt{font-size:13px;font-weight:600;color:var(--ink)}
.ov-legend .lg .lgd{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.ov-hist{display:flex;flex-direction:column;gap:0}

.ov-hist .hr:first-child{border-top:0}
.ov-hist .hr .hd-dot{width:11px;height:11px;border-radius:50%;background:var(--surface-sunk);border:2px solid var(--line);margin-top:3px}
.ov-hist .hr.cur .hd-dot{background:var(--ok);border-color:var(--ok)}
.ov-hist .hr .hv{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.ov-hist .hr .hm{font-size:12px;color:var(--ink-3);margin-top:2px}
.ov-hist .hr .hd-date{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.ov-proto{font-size:11.5px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;display:flex;gap:8px;line-height:1.45}
.ov-proto svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--violet)}

  background:var(--ink);color:var(--ink-inv);border-radius:11px;padding:11px 15px;font-size:12.5px;font-weight:500;
  box-shadow:var(--sh-3);opacity:0;transition:opacity .2s,transform .2s;max-width:min(420px,92vw);display:flex;gap:9px;align-items:center}

let lastFocus=null;
function openOverlay(kind,html){
  closeOverlay(true);
  lastFocus=document.activeElement;
  const scrim=el('<div class="ov-scrim" data-kind="'+kind+'" role="dialog" aria-modal="true" aria-labelledby="ovTitle"><div class="ov-sheet">'+html+'</div></div>');
  document.getElementById('overlayRoot').appendChild(scrim);
  paintIcons(scrim);
  requestAnimationFrame(()=>scrim.classList.add('show'));
  scrim.addEventListener('mousedown',e=>{if(e.target===scrim)closeOverlay();});
  const f=scrim.querySelector('button,[href],input,textarea,[tabindex]:not([tabindex="-1"])');if(f)f.focus();
  scrim.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();closeOverlay();}
    if(e.key==='Tab'){
      const nodes=[...scrim.querySelectorAll('button,[href],input,textarea,select,[tabindex]:not([tabindex="-1"])')].filter(n=>!n.disabled&&n.offsetParent!==null);
      if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
}
function closeOverlay(silent){
  const s=document.getElementById('overlayRoot').firstElementChild;if(!s)return;
  s.classList.remove('show');setTimeout(()=>s.remove(),200);
  if(!silent&&lastFocus&&lastFocus.focus)lastFocus.focus();
}

    case 'close-paige': ST.paige=false;setSeg('segPaige','paige','0');if(ST.state!=='proposal')applyChrome();else toast('This state keeps Paige open to show the proposal.');break;
    case 'edit-brief': drawerEditBrief();break;
    case 'edit-area': drawerEditArea(arg,arg2);break;
    case 'evidence': modalEvidence();break;
    case 'decision': modalDecision(arg);break;
    case 'history': modalHistory();break;
    case 'legend': modalLegend();break;
    case 'toggle-dep': ST.depOpen=!ST.depOpen;pendingFocus='[data-act="toggle-dep"]';renderDesk();break;
    case 'open-horizon': ST.horizon=arg;renderDesk();break;
    case 'systems': toast('Would route to Systems Check to fix this dependency (prototype).');break;
    case 'sibling-tab': toast(arg+' is a separate Command Center surface — this prototype focuses on the Business Game Plan.');break;
    case 'retry': toast('Refreshed (prototype — no data changed).');break;
    case 'deck-dismiss': deckAdvance(arg,-1,'Set aside — it comes back when you restore.');break;
    case 'deck-act': deckAct(arg);break;
    case 'deck-restore': ST.deckDismissed.clear();pendingFocus='.sd-dcard.top';renderDesk();break;
    case 'mission-dismiss': missionDismiss(arg);break;
    case 'mission-restore': ST.missionDismissed.clear();pendingFocus='[data-mid] .sd-caret';renderDesk();break;
    case 'mock-send': toast('Prototype — messages to Paige are mocked here.');break;
    case 'mock-propose': closeOverlay();toast('Paige would draft this as a revision for your approval.');break;
    case 'mock-write': closeOverlay();toast('Prototype — no data was changed. In production this is a governed, approval-gated edit.');break;
    case 'approve-prop': toast('Approved (prototype). In the real product the plan brief would update and Paige would re-align to it.');break;
    case 'edit-prop': toast('You could edit the proposed revision before approving (prototype).');break;
    case 'reject-prop': toast('Rejected — your approved plan is unchanged (prototype).');break;
    case 'close-ov': closeOverlay();break;
  }
}
document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return;}
  const hz=e.target.closest('[data-hz]');
  if(hz){ST.horizon=hz.dataset.hz;ST.openItems.clear();pendingFocus='.sd-hz[data-hz="'+hz.dataset.hz+'"]';renderDesk();return;}
  const actEl=e.target.closest('[data-act]');
  const togEl=e.target.closest('[data-toggle]');
  if(actEl && (!togEl || togEl.contains(actEl))){ handleAct(actEl); return; }
  if(togEl){ toggleItem(togEl.dataset.toggle); return; }
});
document.addEventListener('keydown',e=>{
  const dcard=e.target.closest('.sd-dcard.top');
  if(dcard&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();
    if(e.key==='ArrowLeft')deckAdvance(dcard.dataset.id,-1,'Set aside — restore anytime.'); else deckAct(dcard.dataset.id);return;}
  if((e.key==='Enter'||e.key===' ')){
    // carets are native <button>s (Enter/Space fire click natively); only the div role=button
    // dependency header needs manual key handling.
    if(e.target.matches('[data-act="toggle-dep"]')){e.preventDefault();ST.depOpen=!ST.depOpen;pendingFocus='[data-act="toggle-dep"]';renderDesk();return;}
  }
});

/* pointer-drag: deck swipe + mission swipe-to-dismiss (attached each render) */
function wireInteractions(){
  const top=document.querySelector('.sd-dcard.top'); if(top)attachDeckDrag(top);
  document.querySelectorAll('.sd-swipe-fg').forEach(attachRowDrag);
}
function attachDeckDrag(card){
  if(card._wired)return; card._wired=true;
  let sx=0,sy=0,drag=false,dx=0;
  const hl=card.querySelector('.dc-hint.l'), hr=card.querySelector('.dc-hint.r');
  card.addEventListener('pointerdown',e=>{ if(e.target.closest('button'))return;
    sx=e.clientX;sy=e.clientY;drag=true;dx=0;try{card.setPointerCapture(e.pointerId);}catch(_){}card.classList.add('dragging'); });
  card.addEventListener('pointermove',e=>{ if(!drag)return; dx=e.clientX-sx; const dy=e.clientY-sy;
    if(Math.abs(dx)<6&&Math.abs(dx)<Math.abs(dy))return;
    card.style.transform='translateX('+dx+'px) rotate('+(dx*0.04)+'deg)';
    card.style.opacity=String(Math.max(.35,1-Math.abs(dx)/380));
    if(hr)hr.style.opacity=dx>24?String(Math.min(1,dx/120)):'0';
    if(hl)hl.style.opacity=dx<-24?String(Math.min(1,-dx/120)):'0'; });
  const end=()=>{ if(!drag)return; drag=false; card.classList.remove('dragging'); const id=card.dataset.id;
    if(dx<-90){suppressClick=true;deckAdvance(id,-1,'Set aside — it comes back when you restore.');}
    else if(dx>90){suppressClick=true;deckAct(id);}
    else{card.style.transform='';card.style.opacity='';if(hr)hr.style.opacity='0';if(hl)hl.style.opacity='0';} };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}
function attachRowDrag(fg){
  if(fg._wired)return; fg._wired=true;
  const item=fg.closest('.sd-swipe'); if(!item)return;
  let sx=0,sy=0,drag=false,dx=0,decided=false;
  fg.addEventListener('pointerdown',e=>{ if(e.target.closest('button'))return; sx=e.clientX;sy=e.clientY;drag=true;dx=0;decided=false; });
  fg.addEventListener('pointermove',e=>{ if(!drag)return; dx=e.clientX-sx; const dy=e.clientY-sy;
    if(!decided){ if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){decided=true;fg.classList.add('dragging');try{fg.setPointerCapture(e.pointerId);}catch(_){}} else if(Math.abs(dy)>8){drag=false;return;} }
    if(decided){ fg.style.transform='translateX('+Math.min(0,dx)+'px)'; if(dx<-40)item.querySelector('.sd-swipe-under').style.color='var(--bad)'; } });
  const end=()=>{ if(!drag)return; drag=false; if(!decided)return; fg.classList.remove('dragging'); suppressClick=true;
    if(dx<-70){missionDismiss(item.dataset.mid);} else {fg.style.transform='';} };
  fg.addEventListener('pointerup',end); fg.addEventListener('pointercancel',end);
}

/* ---------------- review chrome wiring ---------------- */
function setSeg(segId,attr,val){document.querySelectorAll('#'+segId+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===val));}
function buildSegs(){
  const s=document.getElementById('segState');
  s.innerHTML=STATES.map(x=>'<button data-state="'+x[0]+'" aria-pressed="'+(x[0]===ST.state)+'">'+x[1]+'</button>').join('');
  const v=document.getElementById('segVp');
  v.innerHTML=Object.keys(VIEWPORTS).map(k=>'<button data-vp="'+k+'" aria-pressed="'+(k===ST.vp)+'">'+k+'</button>').join('');
}
document.getElementById('segState').addEventListener('click',e=>{const b=e.target.closest('[data-state]');if(!b)return;
  ST.state=b.dataset.state;ST.openItems.clear();ST.depOpen=false;
  ST.tenant = ST.state==='switch'?'northwind':'clearpath';
  if(ST.state==='reduced'){ST.rm=true;document.getElementById('rmToggle').checked=true;}
  setSeg('segState','state',ST.state);
  applyChrome();renderDesk();});
document.getElementById('segTheme').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(!b)return;
  ST.theme=b.dataset.theme;setSeg('segTheme','theme',ST.theme);applyChrome();});
document.getElementById('segVp').addEventListener('click',e=>{const b=e.target.closest('[data-vp]');if(!b)return;
  ST.vp=b.dataset.vp;setSeg('segVp','vp',ST.vp);applyChrome();});
document.getElementById('segPaige').addEventListener('click',e=>{const b=e.target.closest('[data-paige]');if(!b)return;
  ST.paige=b.dataset.paige==='1';setSeg('segPaige','paige',b.dataset.paige);applyChrome();});
document.getElementById('rmToggle').addEventListener('change',e=>{ST.rm=e.target.checked;applyChrome();});
document.getElementById('legendBtn').addEventListener('click',modalLegend);

/* ---------------- boot ---------------- */
buildSegs();
paintIcons(document.getElementById('app'));
applyChrome();
renderDesk();
</script>
