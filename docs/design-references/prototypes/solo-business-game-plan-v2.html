<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<title>Business Game Plan</title>
<style>
/* ============================================================================
   Business Game Plan — Solo Command Center prototype (throwaway, read-only).
   Product surface uses the shipped .paige-solo token system verbatim so it reads
   as native to SoloApp. Review chrome is a deliberately separate technical skin.
   ========================================================================== */

/* ---- PRODUCT TOKENS: mirrored from src/solo/solo-tokens.css ---- */
.paige-solo{
  --font:'Geist','Söhne',-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,monospace;
  --canvas:#F6F5F1;--surface:#FFFFFF;--surface-2:#FBFAF7;--surface-sunk:#F0EEE8;
  --line:#E5E1D8;--line-soft:#EFECE4;
  --ink:#171331;--ink-2:#4A4566;--ink-3:#7E7995;--ink-inv:#FBFAF7;
  --rail:#171331;--rail-2:#221C46;--rail-line:#332C5E;--rail-text:#C9C4E0;
  --gold:#C9860C;--gold-bright:#E9A83A;--gold-tint:#FBF1DE;--gold-line:#EFDCB4;
  --violet:#5B3FD6;--violet-2:#7A62E8;--violet-tint:#EEEAFD;--violet-line:#DAD1FA;
  --ok:#1B7A52;--ok-tint:#E4F2EB;--warn:#B4700A;--warn-tint:#FBF0DD;--bad:#B93E37;--bad-tint:#FAE9E7;
  --r-s:8px;--r-m:12px;--r-l:18px;--r-xl:26px;
  --sh-1:0 1px 2px rgba(23,19,49,.05);
  --sh-2:0 2px 4px rgba(23,19,49,.04),0 12px 28px -12px rgba(23,19,49,.14);
  --sh-3:0 24px 60px -18px rgba(23,19,49,.28);
}
.paige-solo[data-theme="dark"]{
  --canvas:#0C0A1B;--surface:#141129;--surface-2:#191637;--surface-sunk:#100D24;
  --line:#282348;--line-soft:#221D3E;
  --ink:#EFECFA;--ink-2:#B0AACB;--ink-3:#7D779A;--ink-inv:#141129;
  --rail:#100D24;--rail-2:#1B1738;--rail-line:#282348;--rail-text:#B0AACB;
  --gold:#E9A83A;--gold-bright:#F5C266;--gold-tint:#2C2211;--gold-line:#4A3A17;
  --violet:#8A72F5;--violet-2:#A692FF;--violet-tint:#221C4A;--violet-line:#352C68;
  --ok:#4CC48C;--ok-tint:#12301F;--warn:#E3A63C;--warn-tint:#2E2311;--bad:#EE7A72;--bad-tint:#331817;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 2px 4px rgba(0,0,0,.25),0 12px 28px -12px rgba(0,0,0,.5);
  --sh-3:0 24px 60px -18px rgba(0,0,0,.6);
}

/* ---- REVIEW CHROME (separate, technical) ---- */
:root{
  --rv-bg:#0b0a12;--rv-panel:#14131f;--rv-panel-2:#1c1b2b;--rv-line:#2a2940;
  --rv-text:#d7d4e6;--rv-text-2:#8f8bad;--rv-accent:#8A72F5;--rv-gold:#E9A83A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--rv-bg);color:var(--rv-text);
  font-family:'Geist','Söhne',-apple-system,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100%;
}
.rv-topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:linear-gradient(180deg,#14131f,#100f18);
  border-bottom:1px solid var(--rv-line);position:sticky;top:0;z-index:40;
}
.rv-brand{display:flex;align-items:center;gap:9px;padding-right:10px;border-right:1px solid var(--rv-line)}
.rv-mark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--rv-accent),#5B3FD6);color:#fff;font-weight:800;font-size:12px}
.rv-brand b{font-size:13px;letter-spacing:-.01em}
.rv-brand span{font-size:11px;color:var(--rv-text-2)}
.rv-group{display:flex;align-items:center;gap:6px}
.rv-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rv-text-2);margin-right:2px}
.rv-seg{display:inline-flex;background:var(--rv-panel-2);border:1px solid var(--rv-line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.rv-seg button{
  font:inherit;font-size:12px;color:var(--rv-text-2);background:none;border:0;
  padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.rv-seg button:hover{color:var(--rv-text)}
.rv-seg button[aria-pressed="true"]{background:var(--rv-accent);color:#fff}
.rv-seg button.rv-warn[aria-pressed="true"]{background:var(--rv-gold);color:#231a06}
.rv-spacer{flex:1 1 auto;min-width:8px}
.rv-note{font-size:11.5px;color:var(--rv-text-2)}
.rv-note b{color:var(--rv-gold);font-weight:600}
.rv-toggle{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--rv-text-2);cursor:pointer;user-select:none}
.rv-toggle input{accent-color:var(--rv-accent);width:15px;height:15px}

/* stage that holds the device frame */
.rv-stage{flex:1 1 auto;min-height:0;overflow:auto;padding:22px;display:grid;place-items:start center;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(122,98,232,.10), transparent 60%),
    repeating-linear-gradient(45deg,transparent,transparent 11px,rgba(255,255,255,.012) 11px,rgba(255,255,255,.012) 12px);
}
.rv-frame-wrap{display:flex;flex-direction:column;gap:9px;align-items:center}
.rv-frame-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--rv-text-2)}
.rv-frame-meta .dot{width:6px;height:6px;border-radius:50%;background:var(--rv-accent)}
.rv-device{
  border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06);
  transition:width .32s cubic-bezier(.22,1,.36,1),height .32s cubic-bezier(.22,1,.36,1);
}
/* the app viewport — this is the SoloApp host the surface fills */
/* container-type makes the surface reflow to the SIMULATED device width (not the real
   browser window), so the harness's size switch faithfully shows responsive behavior.
   Production SoloApp fills the real host, so it uses @media at the same breakpoints. */
.appviewport{width:100%;height:100%;overflow:hidden;background:var(--canvas);container-type:inline-size}

/* ================= SOLO SHELL (minimal, faithful) ================= */
.paige-solo{height:100%;display:flex;background:var(--canvas);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.paige-solo *{box-sizing:border-box}
.paige-solo h1,.paige-solo h2,.paige-solo h3,.paige-solo h4{margin:0;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.paige-solo p{margin:0}
/* Reset stays font/cursor only. It must NOT set border/background here: the element
   selector `.paige-solo button` (0,1,1) would out-specify class rules like `.btn-gold`
   (0,1,0) and silently strip their fill — the cascade collision the design guide warns of. */
.paige-solo button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.paige-solo a{color:var(--violet);text-decoration:none}

/* left nav rail (context only) */
.snav{flex:0 0 auto;width:62px;background:var(--rail);border-right:1px solid var(--rail-line);
  display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;color:var(--rail-text)}
.snav .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px;
  background:linear-gradient(135deg,#7A62E8,#5B3FD6);color:#fff;font-weight:800;font-size:14px}
.snav .nItem{width:40px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--rail-text);opacity:.72}
.snav .nItem.active{background:rgba(255,255,255,.10);opacity:1;color:#fff}
.snav .nItem svg{width:18px;height:18px}
.snav .nspring{flex:1}
@container(max-width:760px){.snav{display:none}}

.smain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* command-center tab strip — faithful to CommandHub */
.cctabs{flex:0 0 auto;display:flex;align-items:stretch;min-height:44px;
  padding:0 clamp(14px,2.2vw,30px);gap:5px;background:var(--surface);border-bottom:1px solid var(--line)}
.cctabs button{position:relative;display:inline-flex;align-items:center;gap:7px;border:0;padding:0 11px;
  background:transparent;color:var(--ink-3);font-size:11.5px;font-weight:650;cursor:pointer;white-space:nowrap}
.cctabs button .tdot{width:14px;height:14px;display:grid;place-items:center;color:currentColor}
.cctabs button[aria-selected="true"]{color:var(--ink);font-weight:800}
.cctabs button[aria-selected="true"] .tdot{color:var(--gold)}
.cctabs button .u{position:absolute;inset:auto 8px -1px;height:2px;border-radius:2px;background:var(--gold);opacity:0}
.cctabs button[aria-selected="true"] .u{opacity:1}
.cctabs button:focus-visible{outline:2px solid var(--violet);outline-offset:-3px;border-radius:6px}

/* ================= GAME PLAN SURFACE ================= */
.gp{flex:1;min-height:0;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr);
  gap:14px;padding:16px clamp(14px,2.2vw,30px) 18px;overflow:hidden}

/* --- Operating brief header --- */
.gp-brief{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.gp-kicker{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.gp-kicker .sep{opacity:.5}
.gp-brief h1{font-size:clamp(19px,2.1vw,25px);margin:7px 0 6px;letter-spacing:-.025em;text-wrap:balance}
.gp-narr{font-size:13.5px;color:var(--ink-2);max-width:64ch;line-height:1.5}
.gp-narr .k{color:var(--ink);font-weight:600}
.gp-attn{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.gp-actions{display:flex;gap:9px;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:10px;
  font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:background .15s,transform .12s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--surface-sunk)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#231703;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.paige-solo[data-theme="dark"] .btn-gold{color:#20180a}
.btn-gold:hover{background:var(--gold-bright)}
.btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.btn-quiet{background:transparent}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:9px}

/* --- operating field: priority column + rail --- */
.gp-field{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:16px;min-height:0}
.gp-col{min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding-right:2px}
.gp-col::-webkit-scrollbar{width:9px}
.gp-col::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
.gp-rail{min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding-right:2px}
@container(max-width:1040px){.gp-field{grid-template-columns:minmax(0,1fr);overflow:auto}.gp-col,.gp-rail{overflow:visible}}

/* card primitive */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px 11px}
.card-hd h2{font-size:13px;letter-spacing:.02em}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* proof chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;flex:none}
.chip .cd{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-live{background:var(--ok-tint);color:var(--ok)}
.chip-partial{background:var(--warn-tint);color:var(--warn)}
.chip-input{background:var(--violet-tint);color:var(--violet)}
.chip-unavail{background:var(--surface-sunk);color:var(--ink-3)}
.chip-blocked{background:var(--bad-tint);color:var(--bad)}
.chip-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-3);font-weight:600}

/* owner badge */
.own{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 5px;border-radius:99px;
  font-size:10.5px;font-weight:700;background:var(--surface-sunk);color:var(--ink-2)}
.own .av{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:800;color:#fff}
.own-you .av{background:linear-gradient(135deg,#4A4566,#171331)}
.own-paige .av{background:linear-gradient(135deg,#7A62E8,#5B3FD6)}
.own-team .av{background:linear-gradient(135deg,#C9860C,#E9A83A);color:#231703}

/* --- Best next move (signature) --- */
/* §11: gold is spent ONLY on the act (the CTA button). The card is distinguished
   by elevation + a violet accent (the brand's calm ground), never a decorative gold fill. */
.bnm{position:relative;overflow:hidden;border:1px solid var(--violet-line);
  background:var(--surface);box-shadow:var(--sh-2)}
.bnm::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--violet),var(--violet-2),transparent)}
.bnm.blocked{border-color:var(--bad-tint)}
.bnm.blocked::before{background:linear-gradient(90deg,var(--bad),transparent)}
.bnm-in{padding:16px 18px 17px;display:flex;flex-direction:column;gap:11px}
.bnm-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.bnm-star{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--violet-tint);color:var(--violet)}
.bnm.blocked .bnm-star{background:var(--bad-tint);color:var(--bad)}
.bnm-lbl{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--violet)}
.bnm.blocked .bnm-lbl{color:var(--bad)}
.bnm h2{font-size:clamp(16px,1.7vw,20px);letter-spacing:-.02em;text-wrap:balance}
.bnm-why{font-size:13px;color:var(--ink-2);max-width:60ch;line-height:1.5}
.bnm-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bnm-cta{display:flex;gap:9px;flex-wrap:wrap;margin-top:3px}
.bnm-block{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--bad);
  background:var(--bad-tint);border:1px solid var(--bad-tint);padding:9px 11px;border-radius:var(--r-m)}
.bnm-block svg{width:16px;height:16px;flex:none;margin-top:1px}

/* --- Priority path list --- */
.pp-list{display:flex;flex-direction:column}
.pp{border-top:1px solid var(--line-soft);padding:12px 16px}
.pp:first-child{border-top:0}
.pp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;cursor:pointer}
.pp-rank{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px;
  font-size:11px;font-weight:800;background:var(--surface-sunk);color:var(--ink-3);font-family:var(--mono)}
.pp-main{min-width:0}
.pp-title{font-size:13.5px;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pp-why{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.pp-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:center}
.pp-caret{flex:none;color:var(--ink-3);transition:transform .2s;margin-top:2px}
.pp[aria-expanded="true"] .pp-caret{transform:rotate(180deg)}
.pp-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s cubic-bezier(.22,1,.36,1)}
.pp[aria-expanded="true"] .pp-detail{grid-template-rows:1fr}
.pp-detail>div{overflow:hidden}
.pp-detail-in{padding:11px 0 3px 34px;display:flex;flex-direction:column;gap:10px}
.pp-fact{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;font-size:12.5px}
.pp-fact .fl{color:var(--ink-3);font-weight:600}
.pp-fact .fv{color:var(--ink-2)}
.pp-detail .bnm-cta{margin-top:2px}
.pp.is-blocked .pp-rank{background:var(--bad-tint);color:var(--bad)}

/* --- Foundation list --- */
.fnd{display:flex;flex-direction:column}
.fnd-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:11px 16px;border:0;border-top:1px solid var(--line-soft);text-align:left;width:100%;background:none;transition:background .12s}
.fnd-row:first-child{border-top:0}
.fnd-row:hover{background:var(--surface-2)}
.fnd-row:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
.fnd-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--surface-sunk);color:var(--ink-3)}
.fnd-ic svg{width:15px;height:15px}
.fnd-row.grounded .fnd-ic{background:var(--ok-tint);color:var(--ok)}
.fnd-row.incomplete .fnd-ic{background:var(--warn-tint);color:var(--warn)}
.fnd-row.needs-input .fnd-ic{background:var(--violet-tint);color:var(--violet)}
.fnd-body{min-width:0}
.fnd-name{font-size:13px;font-weight:600;color:var(--ink)}
.fnd-note{font-size:11.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.fnd-go{color:var(--ink-3);flex:none;display:flex;align-items:center;gap:4px}
.fnd-go svg{width:15px;height:15px}

/* coverage meter */
.cov{padding:13px 16px 15px;border-top:1px solid var(--line-soft)}
.cov-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cov-top b{font-size:19px;font-family:var(--mono);letter-spacing:-.01em;color:var(--ink)}
.cov-top b .of{color:var(--ink-3);font-size:13px;font-weight:500}
.cov-bar{height:7px;border-radius:99px;background:var(--surface-sunk);overflow:hidden;margin-top:9px;display:flex}
.cov-bar i{display:block;height:100%}
.cov-bar .g{background:var(--ok)}
.cov-bar .p{background:var(--warn)}
.cov-cap{font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.45}

/* work in motion */
.mot-first{padding:16px;display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.mot-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--violet-tint);color:var(--violet)}
.mot-ic svg{width:18px;height:18px}
.mot-first h3{font-size:13.5px}
.mot-first p{font-size:12.5px;color:var(--ink-3);line-height:1.5;max-width:44ch}
.mot-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:11px 16px;border-top:1px solid var(--line-soft)}
.mot-row:first-child{border-top:0}
.mot-name{font-size:13px;font-weight:600;color:var(--ink)}
.mot-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.mot-count{font-size:12px;font-weight:700;color:var(--ink-2);font-family:var(--mono);white-space:nowrap}
.mot-caveat{font-size:11px;color:var(--ink-3);padding:10px 16px 13px;line-height:1.45;border-top:1px solid var(--line-soft);
  display:flex;gap:7px}
.mot-caveat svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--ink-3)}

/* paige partner strip */
.pg-partner{background:linear-gradient(135deg,var(--rail),var(--rail-2));border-color:var(--rail-line);color:var(--rail-text)}
.pg-partner .card-hd h2{color:#fff}
.pg-partner .eyebrow{color:#B9B2E0}
.pg-partner-in{padding:0 16px 15px;display:flex;flex-direction:column;gap:11px}
.pg-partner p{font-size:12.5px;color:var(--rail-text);line-height:1.5}
.pg-seed{display:flex;flex-direction:column;gap:7px}
.pg-seed button{text-align:left;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-m);
  background:rgba(255,255,255,.055);border:1px solid var(--rail-line);color:#EDEAFB;font-size:12.5px;transition:background .14s}
.pg-seed button:hover{background:rgba(255,255,255,.10)}
.pg-seed button:focus-visible{outline:2px solid var(--violet-2);outline-offset:2px}
.pg-seed button svg{width:15px;height:15px;color:var(--gold-bright);flex:none}
.pg-open{background:#fff;color:#171331;border-color:#fff;align-self:flex-start}
.paige-solo[data-theme="dark"] .pg-open{background:var(--violet);color:#fff;border-color:var(--violet)}

/* empty-state hero (first-use) */
.first{grid-row:1 / -1;display:grid;place-items:center;padding:8px}
.first-in{max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.first-badge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(135deg,#7A62E8,#5B3FD6);color:#fff;box-shadow:var(--sh-2)}
.first-badge svg{width:26px;height:26px}
.first h1{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em}
.first p{font-size:13.5px;color:var(--ink-2);max-width:52ch;line-height:1.55}
.first-steps{display:grid;gap:9px;width:100%;max-width:460px;text-align:left;margin-top:4px}
.first-step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);transition:background .12s}
.first-step:hover{background:var(--surface-2)}
.first-step .num{width:22px;height:22px;border-radius:7px;background:var(--violet-tint);color:var(--violet);
  display:grid;place-items:center;font-weight:800;font-size:11px;font-family:var(--mono)}
.first-step .st{min-width:0}
.first-step .st b{font-size:13px;font-weight:600;color:var(--ink);display:block}
.first-step .st span{font-size:11.5px;color:var(--ink-3)}
.first-step .go{color:var(--ink-3);display:flex}
.first-step .go svg{width:16px;height:16px}
.first-cta{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--surface-sunk) 25%,var(--line-soft) 37%,var(--surface-sunk) 63%);
  background-size:400% 100%;animation:shim 1.3s ease infinite;border-radius:7px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-line{height:12px;margin:7px 0}

/* error / stale */
.errbox{padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.errbox .ei{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bad-tint);color:var(--bad)}
.errbox .ei svg{width:20px;height:20px}
.errbox h3{font-size:14px}.errbox p{font-size:12.5px;color:var(--ink-3);max-width:40ch}
.stale-banner{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:var(--r-m);
  background:var(--warn-tint);border:1px solid var(--gold-line);color:var(--warn);font-size:12.5px;font-weight:600}
.stale-banner svg{width:15px;height:15px;flex:none}

/* toast */
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(6px);
  background:var(--ink);color:var(--ink-inv);padding:9px 15px;border-radius:99px;font-size:12.5px;font-weight:600;
  box-shadow:var(--sh-3);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:80%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* annotation markers */
.anno{position:relative}
.anno::after{content:attr(data-anno);position:absolute;z-index:15;top:-9px;left:10px;
  font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--rv-accent);color:#fff;
  padding:2px 7px;border-radius:99px;box-shadow:0 4px 10px -3px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .15s}
body.show-anno .anno{outline:1px dashed rgba(122,98,232,.55);outline-offset:2px;border-radius:6px}
body.show-anno .anno::after{opacity:1}

/* reveal animation (from a VISIBLE rest — starts at full opacity so thumbnail/rest frame is complete) */
.gp .card,.gp-brief,.bnm{animation:rise .5s cubic-bezier(.22,1,.36,1) backwards}
.gp .gp-col>*:nth-child(2){animation-delay:.05s}
.gp .gp-rail>*:nth-child(1){animation-delay:.06s}
.gp .gp-rail>*:nth-child(2){animation-delay:.11s}
.gp .gp-rail>*:nth-child(3){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
body.reduce-motion *{animation:none!important;transition:none!important}

/* approval panel (bottom sheet in review chrome) */
.rv-approve{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;

.rv-approve .ipt::placeholder{color:var(--rv-text-2)}
.rv-btn{font:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--rv-line);

.rv-btn:hover{border-color:var(--rv-accent)}

/* ---------- STATES registry (order in picker) ---------- */
const STATES=[
  ['empty','Empty'],['partial','Partial'],['grounded','Grounded'],
  ['blocked','Blocked'],['owner','Owner action'],['motion','In motion'],
  ['loading','Loading'],['error','Error / stale']
];

/* ---------- runtime ---------- */
let cur='grounded', vp='1536', theme='light', account='A';
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

/* tab strip (faithful order: Business Game Plan · Systems Check · Trust Compass · Mind) */
const TABS=[['plan','Business Game Plan',I.target,true],['sys','Systems Check',I.activity,false],
  ['compass','Trust Compass',I.compass,false],['mind','Mind',I.brain,false]];
function renderTabs(){
  const strip=$('#cctabs');strip.innerHTML='';
  TABS.forEach(([k,label,ic,active],i)=>{
    const b=el('button',null,`<span class="tdot">${ic}</span>${label}<span class="u"></span>`);
    b.setAttribute('role','tab');b.setAttribute('aria-selected',active?'true':'false');
    b.tabIndex=active?0:-1;b.dataset.k=k;
    b.addEventListener('keydown',e=>{
      let n=null;const N=TABS.length;
      if(e.key==='ArrowRight')n=(i+1)%N;if(e.key==='ArrowLeft')n=(i-1+N)%N;
      if(e.key==='Home')n=0;if(e.key==='End')n=N-1;
      if(n===null)return;e.preventDefault();strip.children[n].focus();
    });
    b.addEventListener('click',()=>{ if(k!=='plan') toast('In the real app this opens '+label+'. This prototype models Business Game Plan only.'); });
    strip.appendChild(b);
  });
}

/* proof attention chips in the brief */
function attn(list){return (list||[]).map(a=>`<span class="chip ${({live:'chip-live',partial:'chip-partial',input:'chip-input',blocked:'chip-blocked'})[a.k]}"><span class="cd"></span>${a.t}</span>`).join('');}

function ctaBtns(list){
  return (list||[]).map(c=>{
    const cls=c.primary?'btn btn-gold':c.paige?'btn':'btn btn-sm';
    const ic=c.paige?I.spark:I.arrow;
    return `<button class="${cls}" data-dest="${c.dest}" data-paige="${c.paige?1:0}">${c.paige?ic+' ':''}${c.label}${c.paige?'':' '+I.arrow}</button>`;
  }).join('');
}

function renderPlan(d){
  const p=$('#panel');p.innerHTML='';
  const gp=el('div','gp');

  /* --- brief --- */
  const hr=new Date().getHours();
  const brief=el('div','gp-brief anno');brief.dataset.anno='Opening operating brief — what’s building, what needs you, the one best move';
  brief.innerHTML=`<div>
    <div class="gp-kicker">${d.greeting.kicker.map((x,i)=>i?`<span class="sep">·</span>${x}`:x).join(' ')}</div>

    <p class="gp-narr">${d.narrative}</p>
    <div class="gp-attn">${attn(d.attention)}</div>
  </div>
  <div class="gp-actions">
    <button class="btn btn-quiet btn-sm" data-refresh="1">${I.refresh} Refresh</button>
    <button class="btn btn-gold" data-dest="PAIGE" data-paige="1">${I.spark} Put PAIGE to work</button>
  </div>`;
  gp.appendChild(brief);

  const field=el('div','gp-field');
  const col=el('div','gp-col');

  /* --- best next move --- */
  const b=d.best;
  const bnm=el('div',`card bnm ${b.proof==='blocked'?'blocked':''} anno`);
  bnm.dataset.anno='Best next move — the single spotlighted decision';
  bnm.innerHTML=`<div class="bnm-in">
    <div class="bnm-top"><div class="bnm-star">${b.proof==='blocked'?I.lock:I.star}</div>
      <span class="bnm-lbl">${b.proof==='blocked'?'Top move · blocked':'The one move that matters most now'}</span></div>
    <h2>${b.title}</h2>
    <p class="bnm-why">${b.why}</p>
    ${b.blocked?`<div class="bnm-block">${I.alert}<span>${b.blocked}</span></div>`:''}

    <div class="bnm-cta">${ctaBtns(b.cta)}</div>
  </div>`;
  col.appendChild(bnm);

  /* --- priority path --- */
  const pcard=el('div','card anno');pcard.dataset.anno='Priority path — why · evidence · owner · what happens · where to act';
  pcard.innerHTML=`<div class="card-hd"><div><span class="eyebrow">${I.target} Priority path</span></div>
    <span class="chip chip-ghost">Derived from your foundation &amp; findings</span></div>`;
  const list=el('div','pp-list');
  d.priorities.forEach(pr=>{
    const row=el('div',`pp ${pr.proof==='blocked'?'is-blocked':''}`);row.setAttribute('aria-expanded','false');
    row.innerHTML=`
      <div class="pp-row" role="button" tabindex="0" aria-expanded="false">
        <div class="pp-rank">${pr.rank}</div>
        <div class="pp-main">
          <div class="pp-title">${pr.title}</div>
          <div class="pp-why">${pr.why}</div>
          <div class="pp-tags">${ownerBadge(pr.owner)} ${chip(pr.proof)}</div>
        </div>
        <div class="pp-caret">${I.caret}</div>
      </div>
      <div class="pp-detail"><div><div class="pp-detail-in">
        <div class="pp-fact"><span class="fl">Why now</span><span class="fv">${pr.why}</span></div>
        <div class="pp-fact"><span class="fl">Evidence</span><span class="fv">${pr.detail.evidence}</span></div>
        <div class="pp-fact"><span class="fl">What happens</span><span class="fv">${pr.detail.happens}</span></div>
        <div class="pp-fact"><span class="fl">Where</span><span class="fv">${pr.detail.dest}</span></div>
        <div class="bnm-cta">${ctaBtns(pr.cta)}</div>
      </div></div></div>`;
    const head=row.querySelector('.pp-row');
    const toggle=()=>{const now=row.getAttribute('aria-expanded')==='true';row.setAttribute('aria-expanded',String(!now));head.setAttribute('aria-expanded',String(!now));};
    head.addEventListener('click',e=>{if(e.target.closest('.btn'))return;toggle();});
    head.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
    list.appendChild(row);
  });
  pcard.appendChild(list);
  col.appendChild(pcard);
  field.appendChild(col);

  /* --- rail --- */
  const rail=el('div','gp-rail');

  /* foundation */
  const fnd=el('div','card anno');fnd.dataset.anno='Business foundation — grounded / needs input / incomplete, each clicks to its owner';
  const fp=d.coverage.grounded===d.coverage.total?'live':(d.foundation.some(f=>f.status==='needs-input')?'input':'partial');
  fnd.innerHTML=`<div class="card-hd"><div><span class="eyebrow">${I.building} Business foundation</span></div>${chip(fp)}</div>`;
  const fl=el('div','fnd');
  const fIcon={grounded:I.check,incomplete:I.info,'needs-input':I.alert};
  d.foundation.forEach(f=>{
    const st=f.status;

    <div class="cov-cap">${c.cap}</div>`;
  fnd.appendChild(cov);
  rail.appendChild(fnd);

  /* work in motion */
  const mot=el('div','card anno');mot.dataset.anno='Work in motion — real department status, or an honest first-use state';
  mot.innerHTML=`<div class="card-hd"><div><span class="eyebrow">${I.activity} Work in motion</span></div>${d.motion.mode==='active'?chip('partial'):chip('unavail')}</div>`;

    const mb=el('div',null);

    });
    mot.appendChild(mb);
    if(d.motion.caveat){
      mot.appendChild(el('div','mot-caveat',`${I.info}<span>Shown by department — open work and what’s awaiting you. Which specialist handled each item isn’t recorded yet, so we don’t name one.</span>`));
    }
  }else{
    mot.appendChild(el('div','mot-first',`<div class="mot-ic">${I.activity}</div>
      <h3>Nothing is in motion yet</h3>
      <p>As you and PAIGE act on the plan, the work she picks up will appear here — drafts, sends, bookings and builds, with what’s waiting on you. It stays empty until there’s real work to show.</p>`));
  }
  rail.appendChild(mot);

  /* paige partner */
  const pg=el('div','card pg-partner anno');pg.dataset.anno='PAIGE partner — opening the ONE conversation is LIVE (openPaige); auto pre-fill of a starter prompt is a pending backend wire (#771), tracked in the evidence plan';
  pg.innerHTML=`<div class="card-hd"><div><span class="eyebrow">${I.spark} Your operating partner</span></div></div>
    <div class="pg-partner-in">

      <div class="pg-seed">${(d.seed||[]).map(s=>`<button data-dest="PAIGE" data-paige="1" data-seed="${s}">${I.spark}<span>${s}</span></button>`).join('')}</div>
      <button class="btn pg-open" data-dest="PAIGE" data-paige="1">Open PAIGE ${I.arrow}</button>
    </div>`;
  rail.appendChild(pg);

  field.appendChild(rail);
  gp.appendChild(field);
  p.appendChild(gp);

function statusWord(s){return {grounded:'Grounded',incomplete:'Finish',['needs-input']:'Add'}[s]||'Open';}

/* ---------- dest handling (prototype: everything is mocked) ---------- */
function bindDest(){
  $('#panel').addEventListener('click',e=>{
    const t=e.target.closest('[data-dest]');if(!t)return;
    const dest=t.dataset.dest, paige=t.dataset.paige==='1', seed=t.dataset.seed;
    if(paige){toast(seed?('Opens PAIGE with: “'+seed+'” — prototype only, nothing sent.'):'Opens the one PAIGE conversation — prototype only.');}
    else{toast('In the real app this goes to '+dest+'. Prototype navigations are mocked.');}
  });
  $('#panel').addEventListener('click',e=>{
    const r=e.target.closest('[data-refresh]');if(!r)return;
    toast('Refreshing connected reads… (mocked)');
  });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  let t=$('#toast');if(!t){t=el('div','toast');t.id='toast';$('#panel').appendChild(t);}
  t.textContent=msg;requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---------- state / chrome control ---------- */
function setState(k){
  cur=k;
  [...$('#stateSeg').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===k)));
  if(k==='loading'){renderLoading();return;}
  if(k==='error'){renderError();return;}
  const d=DATA[k];
  if(d.empty){renderEmpty(d);return;}
  renderPlan(d);
}
function applyVp(v){
  vp=v;const dev=$('#device');
  const H=v==='900'?1000:(v==='1536'?770:768);
  dev.style.width=v+'px';dev.style.height=H+'px';
  [...$('#vpSeg').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.vp===v)));
  updateFrameLabel();
}
function applyTheme(t){
  theme=t;$('#solo').setAttribute('data-theme',t);
  [...$('#themeSeg').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===t)));
  updateFrameLabel();
}
function updateFrameLabel(){
  const name=vp==='1536'?'Desktop':vp==='1366'?'Laptop':vp==='1024'?'Small laptop':'Portrait / tablet';
  const H=vp==='900'?1000:(vp==='1536'?770:768);
  $('#frameLabel').textContent=`${name} · ${vp}×${H} · ${theme[0].toUpperCase()+theme.slice(1)}`;
}

/* workspace switch — proves full remount / clear */
function switchWorkspace(){
  account=account==='A'?'B':'A';
  const solo=$('#solo');
  solo.style.transition='opacity .16s';solo.style.opacity='.25';
  $('#panel').innerHTML=`<div class="gp"><div style="grid-row:1/-1;display:grid;place-items:center;color:var(--ink-3);font-size:13px">Switching workspace… clearing all Game Plan state</div></div>`;
  setTimeout(()=>{
    // full remount: everything re-renders from the new account's dataset; nothing prior remains
    renderTabs();setState(cur);solo.style.opacity='1';
    toast('Workspace '+account+' — plan remounted; no prior-workspace data, filters, or PAIGE context remain.');
  },520);
}

/* ---------- build review controls ---------- */
function buildControls(){
  const seg=$('#stateSeg');
  STATES.forEach(([k,label])=>{
    const b=el('button',null,label);b.dataset.state=k;b.setAttribute('aria-pressed',String(k===cur));
    b.onclick=()=>setState(k);seg.appendChild(b);
  });
  $('#vpSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)applyVp(b.dataset.vp);});
  $('#themeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)applyTheme(b.dataset.theme);});
  $('#motionTgl').addEventListener('change',e=>document.body.classList.toggle('reduce-motion',e.target.checked));
  $('#annoTgl').addEventListener('change',e=>document.body.classList.toggle('show-anno',e.target.checked));
  $('#switchBtn').addEventListener('click',switchWorkspace);
  document.querySelectorAll('[data-decide]').forEach(b=>b.addEventListener('click',()=>{
    const d=b.dataset.decide,notes=$('#notes').value.trim();
    const v=$('#verdict');
    const word=d==='approve'?'Approved':d==='revise'?'Revision requested':'Rejected';
    v.textContent=`${word}${notes?' — “'+notes+'”':''}. Recorded in this prototype only — nothing was sent.`;
  }));
}

/* ---------- init ---------- */
renderTabs();buildControls();bindDest();applyVp('1536');applyTheme('light');setState('grounded');
</script>
