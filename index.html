    <!-- Cinematic pre-hydration splash — paints before React boots so there
         is no white flash on load. Removed by src/main.tsx once the app mounts. -->
    <style>
      #paige-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        background: radial-gradient(85% 65% at 50% 42%, #1a1033 0%, #0b0818 58%, #07040d 100%);
        transition: opacity 0.7s ease, visibility 0.7s ease;
        perspective: 720px;
      }
      #paige-splash.paige-splash--done {
        opacity: 0;
        visibility: hidden;
      }
      .psx-stage {
        position: relative;
        width: 210px;
        height: 210px;
        transform-style: preserve-3d;
        animation: psxIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* Paige — the orb */
      .psx-orb {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        /* Gold orb core — matches the marketing PaigeScene gold (#D4A752 / #F0C86A)
           for one continuous brand (§6). Hardcoded hex is required here: this splash
           paints before React/index.css load, so --gold/--accent tokens don't exist
           yet. The pale-violet ring below is kept — the marketing scene deliberately
           pairs one gold figure with one violet ring, and it gives the gold orb
           figure/ground separation. */
        background: radial-gradient(circle at 38% 30%, #fff6df 0%, #f0c86a 24%, #d4a752 52%, #8a6a22 100%);
        box-shadow: 0 0 60px 6px rgba(212, 167, 82, 0.5), inset -10px -12px 30px rgba(120, 90, 25, 0.85);
        animation: psxOrb 2.6s ease-in-out infinite;
      }
      .psx-orb::after {
        content: "";
        position: absolute;
        inset: -45%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 167, 82, 0.5), transparent 62%);
        filter: blur(18px);
      }
      /* Orbital rings — tilted ellipses */
      .psx-ring {
        position: absolute;
        inset: 0;
        margin: auto;
        border-radius: 50%;
        border: 1.5px solid;
      }
      .psx-ring--violet {
        width: 210px;
        height: 210px;
        border-color: rgba(192, 132, 252, 0.5);
        transform: rotateX(74deg) rotateZ(0deg);
        animation: psxSpin 5s linear infinite;
      }
      .psx-ring--gold {
        width: 162px;
        height: 162px;
        border-color: rgba(212, 175, 55, 0.6);
        transform: rotateX(66deg) rotateY(20deg) rotateZ(0deg);
        animation: psxSpinGold 7s linear infinite;
      }
      /* A gold particle orbiting on the gold ring */
      .psx-ring--gold::after {
        content: "";
        position: absolute;
        top: -3px;
        left: calc(50% - 3px);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f0d878;
        box-shadow: 0 0 12px 3px rgba(240, 216, 120, 0.85);
      }
      .psx-word {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-family: "Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 0.5em;
        font-size: 15px;
        color: #f3ecff;
        text-transform: uppercase;
        padding-left: 0.5em;
        animation: psxFadeUp 0.9s ease 0.35s both;
      }
      .psx-word i {
        display: block;
        height: 1.5px;
        width: 56px;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
        animation: psxLine 0.9s ease 0.55s both;
      }
      @keyframes psxIn { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: scale(1); } }
      @keyframes psxOrb { 0%, 100% { transform: scale(0.97); } 50% { transform: scale(1.05); } }
      @keyframes psxSpin { to { transform: rotateX(74deg) rotateZ(360deg); } }
      @keyframes psxSpinGold { to { transform: rotateX(66deg) rotateY(20deg) rotateZ(-360deg); } }
      @keyframes psxFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes psxLine { from { width: 0; opacity: 0; } to { width: 56px; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .psx-stage, .psx-orb, .psx-ring, .psx-word, .psx-word i { animation: none !important; }
      }
    </style>

  <body>
    <div id="paige-splash" role="status" aria-label="Loading">
      <div class="psx-stage">
        <div class="psx-ring psx-ring--violet"></div>
        <div class="psx-ring psx-ring--gold"></div>
        <div class="psx-orb"></div>
      </div>
      <div class="psx-word">Paige<i></i></div>
    </div>
    <script>
      // Tenant-facing public pages (a coach's booking page) must NOT show the
      // Paige-branded boot splash — their customers shouldn't meet our brand on
      // the way in. Strip the branding to a quiet neutral cover (kept in place
      // so the SEO marketing markup in #root never flashes) for a fast, dull
      // transition into the tenant's own booking card. Marketing + app keep the
      // cinematic splash. Runs synchronously before first paint.
      (function () {
        if (/^\/(book|booking)(\/|$)/.test(window.location.pathname)) {
          var el = document.getElementById("paige-splash");
          if (el) {
            el.innerHTML = "";
            el.style.background = "#F4F5F7";
            el.style.gap = "0";
            el.style.perspective = "none";
            el.setAttribute("aria-label", "Loading");
          }
        }
      })();
    </script>
    <div id="root">
      <!--
        Static SEO / no-JS fallback for crawlers that do not execute JavaScript.
        §18 ONE HOME (Task #126, owner-ruled 2026-08-12): this skeleton carries ONLY stable,
        SEO-legitimate copy that does NOT change with product decisions — the hero H1, one
        value-prop paragraph, and one primary CTA. Everything product-decision-driven (pricing
        tiers, feature matrix, security specifics, waitlist copy) lives in React ALONE and must
        NEVER be duplicated here — duplication is exactly what let a prior pricing PR leave this
        block stale (a headless reader / crawler saw retired pricing). The `lint:skeleton` CI
        guard fails the build if any non-whitelisted text appears inside #root, so the leak class
        cannot recur. React (createRoot, not hydrate) CLEARS #root on first commit, so this
        content is replaced by the live app for JS visitors and is seen only by no-JS crawlers.
      -->

        <h1 style="font-size:42px;font-weight:800;line-height:1.15;margin-bottom:16px;color:#fff;">Paige — Your AI Business Operations Partner</h1>
        <p style="font-size:18px;color:#d1d5db;line-height:1.6;margin-bottom:24px;">Built for coaches, consultants, and agencies who are serious about scaling. Paige manages your clients, automates your busywork, drafts your outreach, and keeps your entire operation moving — in one conversation.</p>
        <a href="/auth?mode=signup" style="display:inline-block;background:#CFAE70;color:#0a0e1a;font-weight:700;font-size:16px;padding:12px 24px;border-radius:8px;text-decoration:none;">Get started</a>
      </main>
    </div>
