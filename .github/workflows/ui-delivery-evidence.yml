name: ui-delivery-evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-delivery-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate UI delivery evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate evidence routing and attestation
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/ui-delivery-evidence.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
