# Fail-closed §32 premerge migration proof.
#
# A green job means every PR migration was fingerprinted, ordered, applied to a
# representative disposable restore of the current production schema, and its
# changed SQL behavioral proof passed afterward. Restore failure, missing or
# ambiguous candidates, skipped application, execution failure, missing proof,
# or any inconclusive verdict is red. The disposable auth compatibility helper
# lives under .github/scripts/fixtures and is never part of production migrations.
name: premerge-migration-proof

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/premerge-migration-proof.yml"
      - ".github/scripts/premerge-migration-proof.mjs"
      - ".github/scripts/premerge-migration-proof.test.mjs"
      - ".github/scripts/fixtures/migration-proof/**"

concurrency:
  group: premerge-migration-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect proof inputs
    runs-on: ubuntu-latest
    outputs:
      migration_touched: ${{ steps.diff.outputs.migration_touched }}
      tooling_changed: ${{ steps.diff.outputs.tooling_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify migration and proof changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/*.sql' > touched_migrations.txt
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            '.github/workflows/premerge-migration-proof.yml' \
            '.github/scripts/premerge-migration-proof.mjs' \
            '.github/scripts/premerge-migration-proof.test.mjs' \
            '.github/scripts/fixtures/migration-proof/**' > changed_tooling.txt
          if grep -q . touched_migrations.txt; then
            echo "migration_touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_touched=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q . changed_tooling.txt; then
            echo "tooling_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tooling_changed=false" >> "$GITHUB_OUTPUT"
          fi

  contract-tests:
    name: Fail-closed contract tests
    needs: detect
    if: needs.detect.outputs.tooling_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prove intentional failures stay red and genuine completion goes green
        run: node --test .github/scripts/premerge-migration-proof.test.mjs

  environment-canary:
    name: Disposable restore + fixture success canary
    needs: detect
    if: needs.detect.outputs.tooling_changed == 'true' && needs.detect.outputs.migration_touched != 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:15.8.1.020
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Same-repo guard
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Migration proof needs read-only database credentials and cannot run on a fork PR."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Dump current production schema (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are required for the read-only baseline dump."
            exit 1
          fi
          ref="${SUPABASE_PROJECT_ID:-}"
          if [ -z "$ref" ]; then
            ref="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml | head -1)"
          fi
          if [ -z "$ref" ]; then echo "::error::could not resolve production project ref"; exit 1; fi
          supabase link --project-ref "$ref"
          supabase db dump --linked --role-only -f baseline_roles.sql
          supabase db dump --linked -f baseline_schema.sql

      - name: Run representative restore and genuine fixture success
        run: |
          set -euo pipefail
          printf '%s\n' \
            '.github/scripts/fixtures/migration-proof/migrations/20260824000001_fixture_extension.sql' \
            '.github/scripts/fixtures/migration-proof/migrations/20260824000000_fixture_base.sql' \
            > fixture_candidates.txt
          printf '%s\n' '.github/scripts/fixtures/migration-proof/proof.sql' > fixture_proof.txt
          node .github/scripts/premerge-migration-proof.mjs \
            --fixture-mode \
            --candidate-list fixture_candidates.txt \
            --proof-list fixture_proof.txt \
            --baseline-roles baseline_roles.sql \
            --baseline-schema baseline_schema.sql \
            --compatibility-shim .github/scripts/fixtures/migration-proof/disposable-auth-compat.sql \
            --schema-snapshot fixture_schema_after.sql \
            --state fixture_proof_state.json

      - name: Final verdict (missing or incomplete evidence is failure)
        if: always()
        run: node .github/scripts/premerge-migration-proof.mjs --assert-state fixture_proof_state.json

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-proof-environment-canary-${{ github.run_id }}
          path: |
            fixture_proof_state.json
            fixture_schema_after.sql
          if-no-files-found: warn
          retention-days: 14

  prove:
    name: Prove exact PR migration set
    needs: detect
    if: needs.detect.outputs.migration_touched == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:15.8.1.020
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Same-repo guard
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Migration proof needs read-only database credentials and cannot run on a fork PR."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify exact PR candidates and changed behavioral proofs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/*.sql' \
            | sort > changed_migrations.txt
          git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- \
            'supabase/tests/*.sql' 'supabase/tests/**/*.sql' | sort > changed_proofs.txt
          echo "Candidate files:"
          cat changed_migrations.txt
          echo "Behavioral proof files:"
          cat changed_proofs.txt

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Dump current production schema (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are required for the read-only baseline dump."
            exit 1
          fi
          ref="${SUPABASE_PROJECT_ID:-}"
          if [ -z "$ref" ]; then
            ref="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml | head -1)"
          fi
          if [ -z "$ref" ]; then echo "::error::could not resolve production project ref"; exit 1; fi
          supabase link --project-ref "$ref"
          supabase db dump --linked --role-only -f baseline_roles.sql
          supabase db dump --linked -f baseline_schema.sql

      - name: Restore, apply every exact candidate, and verify behavior (fail-closed)
        run: |
          set -euo pipefail
          node .github/scripts/premerge-migration-proof.mjs \
            --candidate-list changed_migrations.txt \
            --proof-list changed_proofs.txt \
            --baseline-roles baseline_roles.sql \
            --baseline-schema baseline_schema.sql \
            --compatibility-shim .github/scripts/fixtures/migration-proof/disposable-auth-compat.sql \
            --schema-snapshot candidate_schema_after.sql \
            --state migration_proof_state.json

      - name: Final verdict (missing or incomplete evidence is failure)
        if: always()
        run: node .github/scripts/premerge-migration-proof.mjs --assert-state migration_proof_state.json

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-proof-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            migration_proof_state.json
            candidate_schema_after.sql
          if-no-files-found: warn
          retention-days: 14
