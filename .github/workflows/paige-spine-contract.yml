name: PAIGE Spine contract

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/paige-spine/**"
      - "supabase/migrations/**"
      - "supabase/tests/paige_spine_foundation.sql"
      - "supabase/tests/media_credit_ledger.sql"
      - "supabase/tests/business_context_readiness.sql"
      - "supabase/tests/team_authority_readiness.sql"
      - "supabase/tests/business_mission_foundation.sql"
      - "supabase/tests/social_foundation.sql"
      - "supabase/tests/social_foundation_rls.sql"
      - "scripts/sql/social-foundation-legacy-shape-proof.sql"
      - "scripts/sql/social-foundation-tenant-shaped-proof.sql"
      # The Solo Team invitation proof must re-run when the seam it proves changes,
      # not only when a migration happens to touch it.
      - "supabase/tests/solo_team_invite_workspace_authority.sql"
      - "supabase/tests/solo_team_invite_recipient_binding.sql"
      # Same reason for the removal proof: it must re-run when the seam changes.
      - "supabase/tests/solo_team_removal_authority.sql"
      - "supabase/functions/solo-team-invitations/**"
      - "supabase/functions/handle-resend-webhook/**"
      - "supabase/tests/resend_receipt_reliability.sql"
      - "scripts/proof/resend-receipt-concurrency.mjs"
      - "scripts/proof/business-mission-concurrency.mjs"
      - "src/__tests__/paige-spine-*.test.ts"
      - "src/solo/paigeClientScope.ts"
      - "src/solo/paigeClientScope.test.ts"
      - "scripts/ci/paige-spine-registry-lint.mjs"
      - "scripts/ci/chat-tool-registry-lint.mjs"
      - "scripts/proof/paige-spine-local-proof.sql"
      - ".github/workflows/paige-spine-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/_shared/paige-spine/**"
      - "supabase/migrations/**"
      - "supabase/tests/paige_spine_foundation.sql"
      - "supabase/tests/media_credit_ledger.sql"
      - "supabase/tests/business_context_readiness.sql"
      - "supabase/tests/team_authority_readiness.sql"
      - "supabase/tests/business_mission_foundation.sql"
      - "supabase/tests/social_foundation.sql"
      - "supabase/tests/social_foundation_rls.sql"
      - "scripts/sql/social-foundation-legacy-shape-proof.sql"
      - "scripts/sql/social-foundation-tenant-shaped-proof.sql"
      # The Solo Team invitation proof must re-run when the seam it proves changes,
      # not only when a migration happens to touch it.
      - "supabase/tests/solo_team_invite_workspace_authority.sql"
      - "supabase/tests/solo_team_invite_recipient_binding.sql"
      # Same reason for the removal proof: it must re-run when the seam changes.
      - "supabase/tests/solo_team_removal_authority.sql"
      - "supabase/functions/solo-team-invitations/**"
      - "supabase/functions/handle-resend-webhook/**"
      - "supabase/tests/resend_receipt_reliability.sql"
      - "scripts/proof/resend-receipt-concurrency.mjs"
      - "scripts/proof/business-mission-concurrency.mjs"
      - "src/__tests__/paige-spine-*.test.ts"
      - "src/solo/paigeClientScope.ts"
      - "src/solo/paigeClientScope.test.ts"
      - "scripts/ci/paige-spine-registry-lint.mjs"
      - "scripts/ci/chat-tool-registry-lint.mjs"
      - "scripts/proof/paige-spine-local-proof.sql"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/ci/paige-spine-registry-lint.mjs --self-test
      - run: node --experimental-strip-types scripts/ci/paige-spine-registry-lint.mjs
      # The two per-capability Chat-evidence proofs are listed explicitly. The path filter above
      # already matches src/__tests__/paige-spine-*.test.ts, so omitting them here meant this
      # workflow ran on their changes without running them — they were only covered by the
      # repo-wide vitest in `verify`. A proof a workflow claims to gate and does not run is worse
      # than one it never claimed.
      - run: npx vitest run src/__tests__/paige-spine-registry.test.ts src/__tests__/paige-spine-sql-contract.test.ts src/__tests__/paige-spine-chat-binding.test.ts src/__tests__/paige-spine-mind-binding.test.ts src/__tests__/paige-spine-business-context-readiness.test.ts src/__tests__/paige-spine-team-authority.test.ts src/__tests__/paige-spine-business-mission.test.ts src/solo/paigeClientScope.test.ts

  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: supabase db reset
      - run: supabase test db supabase/tests/paige_spine_foundation.sql
      # Vibe Media Credit Ledger: append-only, closure math, anti-leakage release
      # gate, lazy mint, RLS, and the §59 service-role surface (2026-09-12).
      - run: supabase test db supabase/tests/media_credit_ledger.sql
      # Behavioural proof for the Solo Team invitation seam, against the schema `db reset` just
      # replayed from zero. It rides this job deliberately rather than standing up a second
      # Postgres: the expensive part is `supabase start` + `db reset`, and duplicating it to run
      # one more file would double a 20-minute job for nothing (§24).
      - run: supabase test db supabase/tests/solo_team_invite_workspace_authority.sql
      - run: supabase test db supabase/tests/solo_team_invite_recipient_binding.sql
      - run: supabase test db supabase/tests/solo_team_removal_authority.sql
      - run: supabase test db supabase/tests/solo_team_invite_lifecycle.sql
      # Solo Beta acquisition rides the same freshly replayed database. These two files prove
      # that ordinary browser callers cannot use generic provisioning or cross-user status reads,
      # and that the fixed offer/atomic fulfillment functions retain their least-privilege grants.
      - run: supabase test db supabase/tests/solo_beta_authz_hardening.sql
      - run: supabase test db supabase/tests/solo_beta_offer_boundary.sql
      - run: supabase test db supabase/tests/resend_receipt_reliability.sql
      - run: node scripts/proof/resend-receipt-concurrency.mjs
        env:
          RECEIPT_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # The business_context.readiness contract: grant surface, both caller paths, and the role
      # gate that a tenant-isolation-only proof cannot see (a workspace's own client is an
      # authenticated user of that same tenant). Rides this job for the same reason as the two
      # above — the expensive part is `supabase start` + `db reset` (§24).
      - run: supabase test db supabase/tests/business_context_readiness.sql
      # The team.authority contract. Its load-bearing fixture is a caller who is the legal owner of
      # ANOTHER workspace while holding a plain member seat in their active one — the one shape that
      # makes a dropped is_tenant_owner() tenant argument, and a collapsed permission field, fail
      # loudly. Every real member on production has the two agreeing, so a proof built on
      # real-shaped data alone would pass while either defect shipped.
      - run: supabase test db supabase/tests/team_authority_readiness.sql
      # Business Mission owner/RLS/lifecycle proof and true concurrent replay/CAS proof.
      - run: supabase test db supabase/tests/business_mission_foundation.sql
      - run: supabase test db supabase/tests/social_foundation.sql
      - run: supabase test db supabase/tests/social_foundation_rls.sql
      - run: supabase test db supabase/tests/social_connection_lifecycle.sql
      - run: psql -v ON_ERROR_STOP=1 -f scripts/sql/social-foundation-legacy-shape-proof.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: psql -v ON_ERROR_STOP=1 -f scripts/sql/social-foundation-tenant-shaped-proof.sql postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: node scripts/proof/business-mission-concurrency.mjs
        env:
          BUSINESS_MISSION_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
